<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gloop Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen toy. Header strip (name, mood, health, coins) / stage canvas / scrolling tool tray. Single dark "night playroom" look. */
:root{
  --room:#17142a;
  --stage-top:#241f45;
  --stage-bot:#30295c;
  --floor:#3d3270;
  --floor-edge:#5a4a9a;
  --chip:#262044;
  --chip-hi:#352d5e;
  --ink:#f4effd;
  --muted:#a69ec7;
  --gold:#ffc24b;
  --mood:#79e3b6;
  --health:#ff7d8e;
  --line:#3e3668;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
@supports (height:100dvh){html.mobile,html.mobile body{height:100dvh}}
body{background:var(--room);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.name{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed transparent;
  width:7.5em;min-width:0;padding:2px 0;outline:none}
.name:hover{border-bottom-color:var(--line)}
.name:focus-visible{border-bottom-color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px 12px;flex:1 1 300px;min-width:0}
.bar{flex:1;min-width:0;display:grid;gap:3px}
.bar label{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bar label span{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.fill{height:100%;border-radius:6px;transition:width .25s}
#moodFill{background:var(--mood)}
#healthFill{background:var(--health)}
#foodFill{background:#ffb35c}
#trustFill{background:#c49bff}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:12px;background:var(--room);border:1px solid var(--line)}
.setrow input[type=range]{flex:1;max-width:200px;accent-color:var(--gold)}
.setrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.right{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 8px;min-width:0;max-width:100%}
header{max-width:100%}
.coins{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums;min-width:4.2em}
.coins i{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -3px 0 #c98a1a;display:inline-block}
.btn{font:inherit;font-weight:700;font-size:.85rem;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer}
.btn:hover{background:var(--chip-hi)}
.btn:focus-visible,.tool:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:linear-gradient(var(--stage-top),var(--stage-bot))}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);font-size:.82rem;color:var(--ink);background:rgba(23,20,42,.6);padding:5px 10px;border-radius:10px;pointer-events:none;text-wrap:balance}
.hint:empty{display:none}
.photobar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:8px;width:max-content;max-width:calc(100% - 24px)}
.photobar .btn.on{background:var(--ink);color:var(--room);border-color:var(--ink)}
.zoomreset{position:absolute;right:12px;bottom:12px}
.clearroom{position:absolute;left:10px;bottom:10px;padding:5px 10px;font-size:.78rem;background:rgba(38,32,68,.82)}
.clearroom.arm{background:var(--ink);color:var(--room)}
.msheet{max-height:calc(100% - 16px);overflow-y:auto;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.msheet .btn,.gpanel .btn,.photobar .btn{min-width:0;white-space:normal;overflow-wrap:anywhere}
.gpanel{overflow-x:hidden}
.gpanel *{max-width:100%}
.gcard{grid-template-columns:minmax(0,1fr) auto}
.gcard b,.gcard small{min-width:0;overflow-wrap:anywhere}
.toast{white-space:normal;max-width:calc(100% - 24px);text-align:center}
.hud{max-width:calc(100% - 16px);white-space:normal;flex-wrap:wrap;justify-content:center;border-radius:16px}
.photobar{max-width:calc(100% - 16px)}
.update{max-width:calc(100% - 24px)}
html.mobile .tgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
html.mobile .gcard{padding:8px 10px}
html.mobile .tabs .btn{padding:5px 9px;font-size:.8rem}
html.mobile header .name{min-width:0}
html.mobile .right{flex-shrink:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--room);border-color:var(--ink)}
.glist{display:grid;gap:8px}
.gcard.done{border-color:var(--gold)}
.gcard .meter{grid-column:1 / -1;height:6px;border-radius:4px;background:var(--chip);overflow:hidden}
.gcard .meter i{display:block;height:100%;background:var(--gold)}
.gcard .tag{grid-row:1 / span 2;grid-column:2;font-weight:800;font-size:.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.stats div{background:var(--room);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.78rem;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--room);font-weight:800;font-size:.85rem;
  padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
.traywrap{display:flex;gap:6px;min-width:0;align-items:stretch}
.traywrap .tray{flex:1;min-width:0}
.quickbar{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
.qbtn{display:grid;justify-items:center;gap:2px;width:56px;padding:7px 2px 5px;border-radius:14px;border:1px solid var(--line);background:rgba(38,32,68,.86);color:var(--ink);font:inherit;font-size:.62rem;font-weight:800;cursor:pointer}
.qbtn:hover{background:var(--chip-hi)}
.qbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.qbtn svg{color:var(--gold)}
html:not(.mobile) .quickbar{right:12px}
@media (max-height:520px){.qbtn span{display:none}.qbtn{width:44px;padding:8px 2px}}
.trayarrows{display:none;flex-direction:column;gap:6px;flex:0 0 44px}
.trayarrows .btn{flex:1;padding:0;font-size:1rem;min-height:40px}
.trayarrows .btn:disabled{opacity:.35}
html.mobile .trayarrows{display:flex}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.tool{min-width:0;display:grid;justify-items:center;gap:2px;padding:5px 2px 4px;border-radius:14px;background:var(--chip);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:.66rem;font-weight:800;line-height:1.15;cursor:pointer;position:relative;text-align:center}
.tool span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool svg{width:22px;height:22px}
.tool:hover{background:var(--chip-hi)}
.tool.on{background:var(--ink);color:var(--room);border-color:var(--ink)}
.tool.locked{color:var(--muted)}
.tool.locked svg{opacity:.45}
.tool .fav{position:absolute;top:2px;right:4px;color:var(--gold);font-size:.7rem}
.tool .price{color:var(--gold);font-variant-numeric:tabular-nums}
.tool.arm{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.tool.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.update{position:absolute;right:12px;top:12px;max-width:min(320px,calc(100% - 24px));background:var(--chip);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:grid;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.update strong{font-family:var(--display);font-weight:400;font-size:1.1rem}
.update p{margin:0;color:var(--muted);font-size:.85rem}
.updRow{display:flex;flex-wrap:wrap;gap:6px}
.updRow a.btn{text-decoration:none}
.gpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;box-sizing:border-box;
  background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.gpanel h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.4rem;text-wrap:balance}
.gpanel p{margin:0;color:var(--muted);font-size:.88rem}
.gpanel.side{left:auto;right:12px;top:12px;bottom:12px;transform:none;width:min(360px,calc(100% - 24px));max-height:none}
@media (max-width:640px){.gpanel.side{left:12px;right:12px;width:auto;top:auto;max-height:62%}}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-block;vertical-align:middle;margin-right:6px}
.tool svg{color:var(--tc,currentColor)}
.tool.locked svg{filter:grayscale(1)}
.gcard .ico{width:26px;height:26px;color:var(--tc);vertical-align:middle;margin-right:6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{display:grid;justify-items:center;align-content:start;gap:5px;padding:10px 8px;border-radius:12px;background:var(--room);border:1px solid var(--line);text-align:center;min-width:0}
.tile.done{border-color:var(--gold)}
.tile .big{width:38px;height:38px;color:var(--tc)}
.tile b{font-size:.86rem;line-height:1.15}
.tile small{color:var(--muted);font-size:.72rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .btn{width:100%;padding:5px 6px;font-size:.78rem}
.tile .try{background:transparent;border-style:dashed}
.gcard{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:10px 12px;border-radius:12px;background:var(--room);border:1px solid var(--line)}
.gcard b{font-size:1rem}
.gcard small{grid-column:1;color:var(--muted);font-size:.8rem}
.gcard .best{color:var(--gold);font-variant-numeric:tabular-nums}
.gcard .btn{grid-row:1 / span 2;grid-column:2}
.gbig{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.hud{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--room);
  border-radius:999px;padding:6px 8px 6px 16px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .btn{padding:3px 10px;font-size:.78rem}
@media (max-width:520px){.name{font-size:1.3rem}.tray{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}}
/* phone layout: compact header, actions in a Menu sheet, two-row scrolling tool strip, panels as bottom sheets */
.menubtn{display:none}
.msheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;
  background:var(--chip);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.msheet .btn{padding:11px 6px;font-size:.85rem}
html.mobile .app{gap:6px;padding-block:6px}
header,.stage,.tray{min-width:0;max-width:100%}
html.mobile,html.mobile body{overflow:hidden;overscroll-behavior:none;width:100%}
html.mobile header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px}
html.mobile .name{grid-row:1;grid-column:1;font-size:1.25rem;width:100%}
html.mobile .right{grid-row:1;grid-column:2;gap:8px}
html.mobile .menubtn{display:inline-block;padding:7px 14px}
html.mobile .coins{min-width:0;font-size:1.05rem}
html.mobile .bars{grid-row:2;grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px;flex:none}
html.mobile .bar label{font-size:.56rem;letter-spacing:.05em}
html.mobile .track{height:7px}
html.mobile .stage{border-radius:14px}
html.mobile .hint{font-size:.72rem;top:8px;left:8px;max-width:calc(100% - 16px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.mobile .tray{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));max-height:134px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-bottom:max(2px,env(safe-area-inset-bottom,0px));scrollbar-width:thin;mask-image:linear-gradient(#000 85%,transparent)}
html.mobile .tray::-webkit-scrollbar{display:none}
html.mobile .tool{padding:5px 2px 4px}
html.mobile .gpanel,html.mobile .gpanel.side{left:8px;right:8px;top:auto;bottom:8px;transform:none;width:auto;max-height:78%}
html.mobile .hud{font-size:.78rem;gap:8px;padding:4px 6px 4px 12px;top:44px}
html.mobile .update{left:8px;right:8px;top:auto;bottom:8px;max-width:none}
html.mobile .photobar{bottom:8px}
@media (prefers-reduced-motion:reduce){.tool.shake{animation:none}.fill{transition:none}}
</style>

<div class="app">
  <header>
    <input class="name" id="nameInput" value="Gloop" maxlength="14" aria-label="Creature name" spellcheck="false">
    <div class="bars">
      <div class="bar"><label>Mood <span id="moodNum">60</span></label><div class="track"><div class="fill" id="moodFill" style="width:60%"></div></div></div>
      <div class="bar"><label>Health <span id="healthNum">100</span></label><div class="track"><div class="fill" id="healthFill" style="width:100%"></div></div></div>
      <div class="bar"><label>Food <span id="foodNum">80</span></label><div class="track"><div class="fill" id="foodFill" style="width:80%"></div></div></div>
      <div class="bar"><label>Trust <span id="trustNum">0</span></label><div class="track"><div class="fill" id="trustFill" style="width:50%"></div></div></div>
    </div>
    <div class="right">
      <div class="coins" title="Coins"><i></i><span id="coinNum">10</span></div>
      <button class="btn menubtn" id="menuBtn" aria-expanded="false" aria-controls="menuSheet">Menu</button>
      <button class="btn" id="gamesBtn">Games</button>
      <button class="btn" id="wardrobeBtn">Wardrobe</button>
      <button class="btn" id="shopBtn">Shop</button>
      <button class="btn" id="trophyBtn">Trophies</button>
      <button class="btn" id="photoBtn">Photo</button>
      <button class="btn" id="undoBtn">Undo</button>
      <button class="btn" id="clearBtn">Clear room</button>
      <button class="btn" id="tricksBtn">Tricks</button>
      <button class="btn" id="muteBtn" aria-pressed="false">Sound on</button>
      <button class="btn" id="settingsBtn">Settings</button>
      <button class="btn" id="updateBtn" title="Check GitHub for a newer version">Update</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" hidden></div>
    <div class="hud" id="hud" hidden><span id="hudName"></span><span id="hudScore"></span><span id="hudTime"></span><button class="btn" id="hudQuit">Quit</button></div>
    <div class="gpanel" id="gamePanel" hidden></div>
    <div class="quickbar" id="quickBar">
      <button class="qbtn" data-target="gamesBtn" aria-label="Games"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="4"/><path d="M8 10v4M6 12h4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg><span>Games</span></button>
      <button class="qbtn" data-target="shopBtn" aria-label="Shop"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>Shop</span></button>
      <button class="qbtn" data-target="wardrobeBtn" aria-label="Wardrobe"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l3 2 3-2 5 3-2 4-2-1v10H8V10l-2 1-2-4z"/></svg><span>Style</span></button>
      <button class="qbtn" data-target="trophyBtn" aria-label="Trophies"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg><span>Trophies</span></button>
      <button class="qbtn" data-target="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span></button>
    </div>
    <div class="msheet" id="menuSheet" hidden></div>
    <div class="photobar" id="photoBar" hidden></div>
    <button class="btn zoomreset" id="zoomReset" hidden>Reset zoom</button>
    <button class="btn clearroom" id="clearRoomBtn" title="Remove every item and prop from the room">Clear room</button>
    <div class="update" id="updatePanel" hidden>
      <strong id="updTitle">Update available</strong>
      <p id="updText"></p>
      <div class="updRow">
        <button class="btn" id="updPlay">Play new version</button>
        <a class="btn" id="updSave" download="index.html">Save new file</a>
        <button class="btn" id="updClose">Not now</button>
      </div>
    </div>
  </div>
  <div class="traywrap">
    <nav class="tray" id="tray" aria-label="Tools"></nav>
    <div class="trayarrows"><button class="btn" id="trayUp" aria-label="Scroll tools up">&#9650;</button><button class="btn" id="trayDown" aria-label="Scroll tools down">&#9660;</button></div>
  </div>
</div>

function initBlob(x,y){
  pts=[];
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2;const px=x+Math.cos(a)*R,py=y+Math.sin(a)*R;pts.push({x:px,y:py,px:px,py:py});}

}
// ---------- limbs ----------
// Each limb is a short verlet chain hung off one rim point of the body.
// Rim point i sits at angle i/N*360deg (0 = right, 90 = straight down).
let limbs=[],wave=0,kick=0,simTime=0;
function initLimbs(){
  limbs=[];
  const defs=[{a:1,kind:'arm',side:1},{a:10,kind:'arm',side:-1},{a:4,kind:'leg',side:1},{a:7,kind:'leg',side:-1}];
  for(const d of defs){
    const p=pts[d.a],n=d.kind==='arm'?3:2,seg=d.kind==='arm'?12:11,nodes=[];
    for(let i=1;i<=n;i++){const x=p.x+d.side*i*seg*.6,y=p.y+i*seg*.7;nodes.push({x,y,px:x,py:y});}
    limbs.push(Object.assign({seg,nodes},d));
  }
}
function limbConstraints(c){
  for(const L of limbs){
    const a=pts[L.anchor!==undefined?L.anchor:L.a];
    let ox=a.x-c.x,oy=a.y-c.y;const od=Math.hypot(ox,oy)||1;ox/=od;oy/=od;
    let dx=ox,dy=oy+(L.kind==='leg'?1.3:.7)*gravSign;
    let th=0;
    if(L.kind==='arm'&&wave>0)th=-L.side*(1.9+.5*Math.sin(simTime*16+L.side));
    if(L.kind==='leg'&&kick>0)th=-L.side*.7*Math.sin(simTime*22);
    if(th){const cs=Math.cos(th),sn=Math.sin(th),nx=dx*cs-dy*sn;dy=dx*sn+dy*cs;dx=nx;}
    const dd=Math.hypot(dx,dy)||1;dx/=dd;dy/=dd;
    const k=ko>0?0:(L.kind==='leg'?.22:.14);
    let prev=a,prevW=.35;
    for(const q of L.nodes){
      const ex=q.x-prev.x,ey=q.y-prev.y,d=Math.hypot(ex,ey)||1,df=(d-L.seg)/d;
      q.x-=ex*df*(1-prevW);q.y-=ey*df*(1-prevW);prev.x+=ex*df*prevW;prev.y+=ey*df*prevW;
      if(k&&!(grab&&grab.ref===q)){q.x+=(prev.x+dx*L.seg-q.x)*k;q.y+=(prev.y+dy*L.seg-q.y)*k;}
      prev=q;prevW=.5;
    }
  }
}
function limbNodes(){const out=[];for(const L of limbs)for(const q of L.nodes)out.push(q);return out;}
function nearLimb(x,y,r){let best=null,bd=r;for(const q of limbNodes()){const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;best=q;}}return best;}

function tone(f,d=.12,type='sine',vol=.08,slide=0){
  if(!audioOk)return;
  if(save.muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    const v=Math.max(.0002,vol*(save.volume??1));g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

function rotateBody(a){
  const c=centroid(),cs=Math.cos(a),sn=Math.sin(a);
  for(const p of allBody()){let x=p.x-c.x,y=p.y-c.y;p.x=c.x+x*cs-y*sn;p.y=c.y+x*sn+y*cs;x=p.px-c.x;y=p.py-c.y;p.px=c.x+x*cs-y*sn;p.py=c.y+x*sn+y*cs;}
}

function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+dx*t),py-(y1+dy*t));}
function propAt(x,y){
  const fy=floorY();
  for(let i=plats.length-1;i>=0;i--){const s2=plats[i];
    if(s2.type==='seesaw'){const[x1,y1,x2,y2]=seesawEnds(s2);if(segDist(x,y,x1,y1,x2,y2)<22||(Math.abs(x-s2.px)<24&&y>s2.py-6&&y<=fy+4))return{ref:s2,kind:'plat'};}
    else if(segDist(x,y,s2.x1,s2.y1,s2.x2,s2.y2)<s2.th/2+16)return{ref:s2,kind:'plat'};}
  for(let i=fixtures.length-1;i>=0;i--){const f=fixtures[i];
    if(f.type==='fan'){if(Math.hypot(x-f.x,y-f.y)<34||(Math.abs(x-f.x)<14&&y>f.y&&y<=fy+4))return{ref:f,kind:'fix'};}
    else if(Math.abs(x-f.x)<f.w/2+8&&y>fy-(f.type==='trampoline'?34:26))return{ref:f,kind:'fix'};}
  return null;
}
function dragProp(x,y){
  const g=grab,dx=x-g.lx,dy=y-g.ly,r=g.ref,fy=floorY();g.lx=x;g.ly=y;
  if(g.kind==='fix'){r.x=Math.max(20,Math.min(W-20,r.x+dx));if(r.type==='fan'){r.y=Math.max(50,Math.min(fy-40,r.y+dy));const c0=centroid();r.dir=Math.sign(c0.x-r.x)||r.dir;}}
  else if(r.type==='seesaw'){r.px=Math.max(r.len/2,Math.min(W-r.len/2,r.px+dx));}
  else{let mx=dx,my=dy;const minX=Math.min(r.x1,r.x2),maxX=Math.max(r.x1,r.x2),minY=Math.min(r.y1,r.y2),maxY=Math.max(r.y1,r.y2);
    mx=Math.max(8-minX,Math.min(W-8-maxX,mx));my=Math.max(40-minY,Math.min(fy-6-maxY,my));r.x1+=mx;r.x2+=mx;r.y1+=my;r.y2+=my;}
}

// ---------- helpers ----------
function centroid(){let x=0,y=0;for(const p of pts){x+=p.x;y+=p.y;}return{x:x/N,y:y/N};}
function area(){let a=0;for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];a+=p.x*q.y-q.x*p.y;}return Math.abs(a)/2;}
function inside(x,y){let c=false;for(let i=0,j=N-1;i<N;j=i++){const a=pts[i],b=pts[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))c=!c;}return c;}
function nearestPt(x,y){let best=null,bd=1e9;for(const p of pts){const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=p;}}return{p:best,d:bd};}

function isNight(){if(save.clockOff)return false;const h=new Date().getHours();return h>=20||h<6;}
function nightAmt(){if(save.clockOff)return 0;const d=new Date(),h=d.getHours()+d.getMinutes()/60;if(h>=20||h<6)return 1;if(h>=18)return (h-18)/2;if(h<8)return (8-h)/2;return 0;}

  const a=nightAmt();if(a<=0)return;

  const glow=(x,y,r,rgb,str)=>{const g=ctx.createRadialGradient(x,y,4,x,y,r);g.addColorStop(0,'rgba('+rgb+','+(str*a)+')');g.addColorStop(1,'rgba('+rgb+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();};

    ctx.strokeStyle='rgba(255,226,160,'+(a*.6)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,ly-9);ctx.stroke();
  }else if(rm==='beach'){

    ctx.fillStyle='#f4f0dc';ctx.beginPath();ctx.arc(W*.82,H*.2,26,0,7);ctx.fill();
    ctx.fillStyle='rgba(12,10,40,.85)';ctx.beginPath();ctx.arc(W*.82+11,H*.2-6,22,0,7);ctx.fill();
    ctx.globalAlpha=1;
    const fx=48,fyy=fy;glow(fx,fyy-14,150,'255,150,60',.4);
    ctx.globalAlpha=a;ctx.fillStyle='#5a3a22';ctx.save();ctx.translate(fx,fyy-4);ctx.rotate(.35);ctx.fillRect(-16,-3,32,6);ctx.rotate(-.7);ctx.fillRect(-16,-3,32,6);ctx.restore();
    for(let k=0;k<3;k++){const h=18+Math.sin(simTime*9+k*2)*5;ctx.fillStyle=['#ff6a1f','#ffb347','#ffe27a'][k];ctx.beginPath();ctx.moveTo(fx-9+k*3,fyy-6);ctx.quadraticCurveTo(fx+(k-1)*4,fyy-6-h*1.3,fx+9-k*3,fyy-6);ctx.fill();}
    ctx.globalAlpha=1;
  }else if(rm==='lab'){
    // ceiling strip lights, one of them flickering
    for(const lx of[W*.3,W*.7]){const fl=lx>W/2&&Math.sin(simTime*23)>.92?.3:1;glow(lx,14,160,'200,235,255',.28*fl);
      ctx.fillStyle='rgba(220,240,255,'+(a*fl)+')';ctx.fillRect(lx-40,6,80,6);}
  }else if(rm==='candy'){

    ctx.globalAlpha=a;ctx.fillStyle='#fff4c2';ctx.beginPath();ctx.arc(W*.85,60,22,0,7);ctx.fill();ctx.fillStyle='rgba(12,10,40,.8)';ctx.beginPath();ctx.arc(W*.85+10,54,19,0,7);ctx.fill();ctx.globalAlpha=1;
    ['255,93,143','95,208,255','255,207,90','126,224,181'].forEach((rgb,i)=>{const x=W*(.12+i*.26),y=fy-60-((i*37)%40);glow(x,y,70,rgb,.35);});
  }else if(rm==='attic'){

function rollDrop(chance,minRarity){
  if(Math.random()>chance)return;
  let r=Math.random(),rar=r<.05?'epic':r<.3?'rare':'common';
  if(minRarity==='rare'&&rar==='common')rar=Math.random()<.2?'epic':'rare';
  const it=pick(COLLECT.filter(c=>c.r===rar));save.coll=save.coll||{};
  if(save.coll[it.id]){save.coins+=10;toast('Found another '+it.name+'. +10 coins');}
  else{save.coll[it.id]=1;statMax('collected',Object.keys(save.coll).length);toast('New collectible: '+it.name+' ('+it.r+')'+(it.gives?'! Unlocks '+it.gives+'.':''));sfx.buy();}
  persist();
}

function hurt(dmg,big){
  if(ko>0||dmg<=0)return;
  health=Math.max(0,health-dmg);mood=Math.max(0,mood-dmg*1.1);hurtT=.6;fearT=8;trustAdd(-dmg*.15);poke();
  // combos: hits landing within 1.5s of each other chain up and pay out
  combo=comboT>0?combo+1:1;comboT=1.5;statMax('bestCombo',combo);
  if(combo>=3){const c0=centroid();parts.push({k:'txt',x:c0.x,y:c0.y-R-30,vx:0,vy:-30,t:.9,text:'COMBO x'+combo,c:'#ffe07a'});
    if(combo%5===0){addCoins(combo/5*3,c0.x,c0.y-R-50);say('combo',true);}}
  const c=centroid();for(let i=0;i<Math.min(8,2+dmg/3);i++)parts.push({k:'star',x:c.x+(Math.random()-.5)*50,y:c.y-20,vx:(Math.random()-.5)*160,vy:-80-Math.random()*120,t:.8});
  sfx.ouch();
  if(health<=0){knockOut();return;}
  say(big||dmg>12?'big':'ouch',true);
}

  buzz(dv>34?90:35);

  const fy=floorY(),onFloor=gravSign>0?pts.some(p=>p.y>fy-8):pts.some(p=>p.y<16);
  const hx=c.x,hy=onFloor?(gravSign>0?fy:10):c.y;

}

function spawn(type,x,y){
  if(objs.length>45){const i=objs.findIndex(o=>o.type!=='pip');if(i>=0)objs.splice(i,1);}
  const spec={
    snack:{r:9,m:.6,b:.3,f:.9},ball:{r:16,m:2,b:.85,f:.98},crate:{r:20,m:6,b:.15,f:.7},
    anvil:{r:24,m:40,b:.05,f:.6},firecracker:{r:10,m:1,b:.3,f:.85,fuse:1.6},
    bowling:{r:19,m:22,b:.08,f:.95},cactus:{r:18,m:14,b:.05,f:.4},rocket:{r:9,m:2,b:.2,f:.9,life:3.5},
    glob:{r:7,m:.5,b:.1,f:.5},peel:{r:11,m:.5,b:.05,f:.5},pillow:{r:22,m:1,b:.05,f:.4},pip:{r:20,m:3,b:.3,f:.8},
    gold:{r:11,m:.5,b:.2,f:.9,life:2.5},chili:{r:10,m:.5,b:.2,f:.9,life:1.4}
  }[type];
  const o=Object.assign({type,x,y,px:x,py:y,ang:0},spec);
  objs.push(o);return o;
}
function allBody(){return pts.concat(limbNodes());}
function explode(o,RAD=170,dmgMax=28){
  if(boss&&game&&game.id==='boss'){const d=Math.hypot(o.x-boss.x,o.y-boss.y);if(d<RAD+boss.r)dmgBoss(Math.round(25*(1-d/(RAD+boss.r))+5),boss.x,boss.y-boss.r);}
  const crates=objs.filter(q=>q.type==='crate'&&Math.hypot(q.x-o.x,q.y-o.y)<o.r+q.r+30);
  if(crates.length&&o.type==='firecracker'){RAD*=1.45;dmgMax*=1.4;objs=objs.filter(q=>!crates.includes(q));stat('reactions');toast('Crate bomb!');
    for(const q of crates)for(let i=0;i<8;i++){const a=Math.random()*7,sp=120+Math.random()*240;parts.push({k:'plank',x:q.x,y:q.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,t:1.2,rot:Math.random()*6});}}
  sfx.boom();stat('booms');
  for(const p of allBody()){const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy)||1;if(d<RAD){const s=(1-d/RAD)*16;impulse(p,dx/d*s,dy/d*s-s*.3);}}
  for(const q of objs){if(q===o)continue;const dx=q.x-o.x,dy=q.y-o.y,d=Math.hypot(dx,dy)||1;if(d<RAD){const s=(1-d/RAD)*18/Math.sqrt(q.m);q.px-=dx/d*s;q.py-=dy/d*s+s*.3;}}
  const c=centroid(),d=Math.hypot(c.x-o.x,c.y-o.y);
  if(d<RAD)hurt(Math.round(dmgMax*(1-d/RAD)+4),true);
  for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*260;parts.push({k:'smoke',x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5+Math.random()*.5,r:4+Math.random()*8});}
  parts.push({k:'flash',x:o.x,y:o.y,t:.18});
}

function step(h){
  const g=G*gravSign*h*h*(game&&game.id==='keepup'?.5:1)*(save.room==='underwater'?.55:1), fy=floorY(), top=8, L=8, Rr=W-8;
  const liquid=potion&&potion.kind==='liquid';

function catchPoint(o,c){
  const h=FIX/SUB,g=G*gravSign*h*h,mouthY=c.y+(gravSign>0?-R*.3:R*.3);let x=o.x,y=o.y,vx=o.x-o.px,vy=o.y-o.py;
  for(let i=0;i<300;i++){vx*=.998;vy=vy*.998+g;x+=vx;y+=vy;
    if(x<8||x>W-8)vx=-vx*.6;
    if((vy*gravSign>0)&&(gravSign>0?y>=mouthY:y<=mouthY))return x;
    if(gravSign>0?y>floorY():y<0)return x;}
  return x;
}
function dash(tx,maxV){
  // direct horizontal drive for games: snappy, no hopping needed
  const c=centroid(),tv=Math.max(-maxV,Math.min(maxV,(tx-c.x)*.06));
  for(const q of allBody()){const vx=q.x-q.px;q.px=q.x-(vx+(tv-vx)*.3);}
}

function keepInside(){if(!pts.length)return;const c=centroid(),fy=floorY(),nx=Math.max(R+10,Math.min(W-R-10,c.x)),ny=Math.min(c.y,fy-R-2);if(nx!==c.x||ny!==c.y)moveGloop(nx,ny);

    for(const[r,c]of[[1,'#ff5d5d'],[.66,'#f4effd'],[.33,'#ff5d5d']]){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,t.r*r,0,7);ctx.fill();}
  }
}

function gameReward(g){
  switch(g.id){
    case 'keepup':return 5+g.score*2+(g.score>=10?10:0);
    case 'rain':return 5+g.score*2;case 'toss':return 5+g.score*3;case 'hide':return 5+g.score*4;
    case 'simon':return 5+g.score*5;case 'tower':return 5+g.score;
    case 'course':return g.won?10+g.score*2:5;
    case 'boss':return g.won?100:5+Math.floor(g.score/2);
    default:return 5+g.score*4;
  }
}
function updHud(){if(!game)return;$('hudScore').textContent=game.score+' '+game.def.unit;$('hudTime').textContent=game.t>0?Math.ceil(game.t)+'s':'';}
function gameTick(dt,c){
  const g=game;
  if(g.id==='keepup'){
    g.grace-=dt;
    if(g.grace<=0&&grounded()){endGame();return;}
  }else if(g.id!=='simon'){g.t-=dt;if(g.t<=0){endGame();return;}}
  if(g.id==='rain'){
    // Snack Rain rules: Gloop slides straight under your cursor/finger (or arrow keys / A-D)
    const tx=keyDir?c.x+keyDir*400:(ptr.x>-500?ptr.x:null);
    if(tx!==null)dash(tx,7);
    g.spawnT-=dt;
    if(g.spawnT<=0){g.spawnT=.4+Math.random()*.35;spawn(Math.random()<.15?'chili':'gold',20+Math.random()*(W-40),gravSign>0?24:floorY()-24);}
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i];if(o.type!=='gold'&&o.type!=='chili')continue;
      if(o.touched||Math.hypot(o.x-c.x,o.y-c.y)<R+o.r+20){
        objs.splice(i,1);
        if(o.type==='gold'){g.score++;sfx.coin();parts.push({k:'txt',x:o.x,y:o.y-10,vx:0,vy:-50,t:.8,text:'+1',c:'#ffc24b'});}
        else{g.score=Math.max(0,g.score-2);hurtT=.5;say('hot',true);sfx.ouch();parts.push({k:'txt',x:o.x,y:o.y-10,vx:0,vy:-50,t:.8,text:'-2',c:'#ff7d8e'});}
      }else if(o.y>floorY()-o.r-2||o.y<o.r+10){o.life-=dt;if(o.life<=0)objs.splice(i,1);}
    }
  }
  if(g.id==='hide'){
    g.peekT-=dt;const sp=g.spots[g.hideIdx];
    for(const s2 of g.spots){s2.wig=Math.max(0,s2.wig-dt);s2.shake=Math.max(0,s2.shake-dt);s2.open=Math.max(0,s2.open-dt);}
    if(g.found){g.foundT-=dt;if(g.foundT<=0)setupHide(g);}
    else{dash(sp.x,2);if(g.peekT<=0){g.wigT=(g.wigT??2)-dt;if(g.wigT<=0){g.wigT=2.5+Math.random()*2;sp.wig=.6;if(Math.random()<.5)sfx.giggle();}}}
  }
  if(g.id==='simon'){
    g.lit=g.lit.map(v=>Math.max(0,v-dt));
    if(g.phase==='show'){
      g.st-=dt;
      if(g.st<=0){
        if(g.si<g.seq.length){const k=g.seq[g.si];g.lit[k]=.45;tone([330,392,494,587][k],.3,'triangle',.08);wave=.4;g.si++;g.st=.65;}
        else{g.phase='input';g.ii=0;}
      }
    }
  }
  if(g.id==='tower'){
    g.climbT-=dt;
    let topC=null;for(const o of objs)if(o.type==='crate'&&!o.held&&(!topC||o.y<topC.y))topC=o;
    if(g.climbT<=0&&Math.hypot(vPrev.x,vPrev.y)<2.5){
      g.climbT=.9;const tx=topC?topC.x:c.x,side=Math.max(-1.6,Math.min(1.6,(tx-c.x)*.02));
      for(const q of allBody())impulse(q,side,-3.7*gravSign);kick=.4;
    }
    let maxY=-1e9;for(const p of pts)if(p.y>maxY)maxY=p.y;
    g.score=Math.max(g.score,Math.max(0,Math.round((floorY()-maxY)/10)));
  }
  if(g.id==='course'){
    if(!grab&&ko<=0&&Math.random()<dt*1.2)dash(g.goal.x,2.5);
    if(Math.hypot(c.x-g.goal.x,c.y-g.goal.y)<R+26){g.score=Math.ceil(g.t);g.won=true;stat('courseWins');say('happy',true);endGame();return;}
  }
  if(g.id==='boss'&&boss){
    const b=boss;b.hurtT=Math.max(0,b.hurtT-dt);b.bonkCD-=dt;b.atkT-=dt;
    if(b.kind==='duck'){
      b.y=floorY()-b.r*.8;const dir=Math.sign(c.x-b.x)||1;
      if(b.charge>0){b.charge-=dt;b.x+=b.vx*dt;}else{b.vx=dir*60;b.x+=b.vx*dt;}
      if(b.atkT<=0){b.atkT=4+Math.random()*2;b.charge=1;b.vx=dir*380;sfx.whoosh();}
    }else if(b.kind==='cloud'){
      b.y=95+Math.sin(simTime*1.3)*14;b.x+=Math.max(-80*dt,Math.min(80*dt,c.x-b.x));
      if(b.atkT<=0){b.atkT=3.5+Math.random()*1.5;const tp=pts.reduce((a,p)=>p.y<a.y?p:a);bolts.push({path:makeBolt(b.x,b.y+30,tp.x,tp.y),t:.28});flashT=.12;sfx.thunder();
        for(const q of allBody())impulse(q,(Math.random()-.5)*3,2*gravSign);mood=Math.max(0,mood-4);charT=1.2;say('boss',true);}
    }else{
      b.y=floorY()-b.r;b.x+=Math.max(-40*dt,Math.min(40*dt,W/2-b.x));
      if(b.atkT<=0){b.atkT=3+Math.random()*1.5;const o=spawn('crate',b.x,b.y-b.r-24),dx=c.x-o.x,T=50,hh=FIX/SUB,gs=G*gravSign*hh*hh;
        o.px=o.x-dx/T;o.py=o.y-((c.y-o.y)/T-.5*gs*T);o.fromBoss=true;sfx.whoosh();}
    }
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
    // Gloop bumps into the boss
    if(Math.hypot(c.x-b.x,c.y-b.y)<R+b.r){const s2=Math.sign(c.x-b.x)||1;for(const q of allBody())impulse(q,s2*2.5,-1.5*gravSign);
      if(b.bonkCD<=0){b.bonkCD=.8;dmgBoss(2,c.x,c.y-R);}}
    // thrown things hurt it
    for(const o of objs){if(o.held||o.type==='pip'||o.fromBoss)continue;o.bossCD=Math.max(0,(o.bossCD||0)-dt);
      const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1;
      if(d<b.r+o.r){const sp=Math.hypot(o.x-o.px,o.y-o.py),nx=dx/d,ny=dy/d;o.x=b.x+nx*(b.r+o.r);o.y=b.y+ny*(b.r+o.r);
        o.px=o.x-nx*Math.max(1,sp*.6);o.py=o.y-ny*Math.max(1,sp*.6);
        if(sp>2.2&&o.bossCD<=0){o.bossCD=.5;dmgBoss(Math.min(25,Math.round(sp*Math.sqrt(o.m)*1.2)),o.x,o.y);}}}
    g.score=Math.round(100-b.hp);
    if(b.hp<=0){g.won=true;stat('bossWins');endGame();return;}
  }
  if(g.id==='toss'){
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i];if(o.type!=='ball')continue;
      if(o.life!==undefined){o.life-=dt;if(o.life<=0){objs.splice(i,1);continue;}}else o.life=4;
      for(let k=0;k<g.targets.length;k++){
        const t=g.targets[k],x=t.x+Math.sin(simTime*t.sp+t.ph)*40,y=t.y+Math.cos(simTime*t.sp*.8+t.ph)*20;
        if(Math.hypot(o.x-x,o.y-y)<t.r+o.r){
          g.score++;g.targets[k]=newTarget();objs.splice(i,1);sfx.coin();wave=.8;if(Math.random()<.4)say('happy',true);
          for(let j=0;j<10;j++)parts.push({k:'star',x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*200,t:.7});
          parts.push({k:'txt',x,y:y-20,vx:0,vy:-50,t:.8,text:'+1',c:'#ffc24b'});break;
        }
      }
    }
  }
  if(g.id==='fetch'){
    // States: waiting for a throw -> chasing -> carrying it back -> drops it at your side
    let b=g.ball;
    if(!b||!objs.includes(b)){b=g.ball=spawn('ball',Math.max(30,Math.min(W-30,c.x+90)),c.y-60);g.state='wait';}
    const carried=grab&&grab.ref===b;
    if(carried){b.held=false;g.state='wait';g.carriedBy=true;}
    const d=Math.hypot(b.x-c.x,b.y-c.y),speed=Math.hypot(b.x-b.px,b.y-b.py);
    if(g.state==='wait'){
      // armed once you've thrown it (let go of a moving ball) or it's far away
      if(!carried&&(g.carriedBy&&speed>.8||d>160)){g.state='chase';g.carriedBy=false;}
    }else if(g.state==='chase'){
      if(!carried)dash(b.x,5);
      if(!carried&&(b.touched||d<R+b.r+14)){
        g.score++;g.state='carry';g.t2=.7;b.held=true;mood=Math.min(100,mood+4);say('fetch',true);sfx.coin();wave=.8;
      }
    }else if(g.state==='carry'){
      const hand=limbs[0].nodes[limbs[0].nodes.length-1];
      b.x=hand.x;b.y=hand.y-(b.r+2)*gravSign;b.px=b.x;b.py=b.y;
      if(ptr.x>-500&&Math.abs(ptr.x-c.x)>90)dash(ptr.x,4);
      g.t2-=dt;
      if(g.t2<=0&&(ptr.x<-500||Math.abs(ptr.x-c.x)<140||g.t2<-2.5)){
        // set it down in front, toward you
        const dir=Math.sign((ptr.x>-500?ptr.x:W/2)-c.x)||1;
        b.held=false;b.x=Math.max(b.r+10,Math.min(W-b.r-10,c.x+dir*(R+b.r+8)));b.y=c.y-10*gravSign;
        b.px=b.x-dir*.8;b.py=b.y+1.2*gravSign;g.state='wait';g.carriedBy=false;
      }
    }
    b.touched=false;
  }
  updHud();
}
function endGame(quit){
  const g=game;if(!g)return;game=null;
  $('hud').hidden=true;$('quickBar').hidden=false;setHint();
  objs=objs.filter(o=>o.type!=='gold'&&o.type!=='chili'&&!o.fromBoss);for(const o of objs)o.held=false;
  if(g.id==='course'){plats=plats.slice(0,g.platN0);fixtures=fixtures.slice(0,g.fixN0);saveLayout();}
  if(g.id==='boss')boss=null;
  if(quit){toast('Game ended');return;}
  const reward=gameReward(g);
  if(g.id==='boss'&&g.won)rollDrop(1,'rare');else rollDrop(.25+Math.min(.35,g.score/40));
  save.best=save.best||{};const prev=save.best[g.id]||0,isBest=g.score>prev;
  if(isBest)save.best[g.id]=g.score;
  statMax('best_'+g.id,g.score);trustAdd(3);
  if(reward>0){save.coins+=reward;sfx.buy();}
  mood=Math.min(100,mood+Math.min(20,g.score*1.5));persist();
  say(g.score>0?'happy':'sad',true);
  const p=$('gamePanel');p.innerHTML='';
  p.append(el('h2',null,g.def.name+(isBest&&g.score>0?': new best!':'')),el('div','gbig',g.score+' '+g.def.unit),
    el('p',null,'You earned '+reward+' coins. Spend them in the Shop.'+(isBest||!prev?'':' Best is '+prev+'.')));
  const row=el('div','updRow');
  const again=el('button','btn','Play again');again.onclick=()=>startGame(g.id);
  const more=el('button','btn','Other games');more.onclick=showGames;
  const done=el('button','btn','Done');done.onclick=()=>{p.hidden=true;};
  row.append(again,more,done);p.append(row);p.hidden=false;
}

function priceBtn(price,onBuy){

    if(save.coins<price){toast('Need '+(price-save.coins)+' more coins');return;}
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Buy for '+price+'?';setTimeout(()=>{b.dataset.arm='';b.textContent=price+' coins';},3000);return;}
    save.coins-=price;onBuy();stat('buys');sfx.buy();persist();showShop();

function release(e){
  if(grab&&grab.type==='fix'){grab=null;ptr.down=false;saveLayout();return;}
  if(grab&&grab.type==='obj'&&grab.ref.type==='snack'&&Math.hypot(grab.ref.x-grab.ref.px,grab.ref.y-grab.ref.py)>1.5)grab.ref.thrown=true;
  if(e&&e.pointerType==='touch'){touches.delete(e.pointerId);if(touches.size<2&&pinch){pinch=null;ptr.down=false;return;}}
  if(lp&&lp.open){
    const list=radialTools(),dx=ptr.sx-lp.sx,dy=ptr.sy-lp.sy;
    if(Math.hypot(dx,dy)>24){const a=(Math.atan2(dy,dx)+Math.PI*2.5)%(Math.PI*2),i=Math.floor(a/(Math.PI*2/list.length))%list.length;tool=list[i];buildTray();setHint();remember(tool);reactToTool(tool);sfx.pop();}
    lp=null;ptr.down=false;aim=null;grab=null;return;
  }
  lp=null;
  if(aim){
    // flick: the item leaves from the cursor, in the direction you dragged
    const dx=ptr.x-aim.x,dy=ptr.y-aim.y,d=Math.hypot(dx,dy);
    if(aim.tool==='snack'){save.coins-=2;persist();}
    const o=spawn(aim.tool,d>10?ptr.x:aim.x,d>10?ptr.y:aim.y);
    if(d>10){const v=throwVel(dx,dy);o.px=o.x-v.x;o.py=o.y-v.y;o.thrown=true;sfx.whoosh();}
    logPlace(()=>objs,o);
    aim=null;
  }
  if(grab&&(grab.type==='pt'||grab.type==='limb')&&Math.hypot(vPrev.x,vPrev.y)>12)stat('flings');
  ptr.down=false;grab=null;try{cv.releasePointerCapture(e.pointerId);}catch(_){}}

  const dx=(ptr.sx??lp.sx)-lp.sx,dy=(ptr.sy??lp.sy)-lp.sy,sel=Math.hypot(dx,dy)>24?Math.floor(((Math.atan2(dy,dx)+Math.PI*2.5)%(Math.PI*2))/(Math.PI*2/n))%n:-1;
  for(let i=0;i<n;i++){
    const a0=-Math.PI/2+i*Math.PI*2/n,a1=a0+Math.PI*2/n;
    ctx.fillStyle=i===sel?'rgba(244,239,253,.95)':'rgba(38,32,68,.92)';ctx.beginPath();ctx.arc(cx,cy,r1,a0,a1);ctx.arc(cx,cy,r0,a1,a0,true);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.stroke();
    const am=(a0+a1)/2,tx=cx+Math.cos(am)*(r0+r1)/2,ty=cy+Math.sin(am)*(r0+r1)/2;
    ctx.fillStyle=i===sel?'#17142a':'#f4effd';ctx.font='800 11px Nunito, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(TOOLS.find(t=>t.id===list[i]).name,tx,ty);ctx.textAlign='start';
  }
}
function playMusic(dt){
  if(!save.music||save.muted||!actx)return;
  const song=SONGS[save.room]||SONGS.night;musicAcc+=dt;
  while(musicAcc>=song.step){
    musicAcc-=song.step;const ch=song.chords[Math.floor(musicStep/8)%song.chords.length],k=musicStep%8;
    const note=ch[[0,1,2,1,0,2,1,2][k]],f=song.root*Math.pow(2,note/12);
    tone(f,song.step*.9,song.wave,.022);
    if(k===0)tone(song.root/2*Math.pow(2,ch[0]/12),song.step*3.5,'sine',.04);
    musicStep++;
  }
}
function popBubble(){if(bubbleT>0||true){bubbleT=0;const c=centroid();sfx.pop();for(let i=0;i<14;i++){const a=Math.random()*7,sp=80+Math.random()*160;parts.push({k:'rain',x:c.x+Math.cos(a)*R*1.3,y:c.y+Math.sin(a)*R*1.3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:.4});}}}
function drawBubble(){
  if(bubbleT<=0)return;const c=centroid(),r=R*1.45+Math.sin(simTime*5)*2;
  ctx.fillStyle='rgba(170,230,255,.16)';ctx.strokeStyle='rgba(200,240,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,r*.82,-2.4,-1.7);ctx.stroke();
  if(bubbleT<1.2&&Math.sin(simTime*30)>0){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(c.x,c.y,r+3,0,7);ctx.stroke();}
}
function drawMagnet(){
  if(tool!=='magnet'||!ptr.down||ptr.x<-500||game)return;
  ctx.save();ctx.translate(ptr.x,ptr.y);ctx.strokeStyle='rgba(255,120,120,.35)';ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){const r=((simTime*60+i*30)%90)+14;ctx.globalAlpha=1-r/104;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();}
  ctx.globalAlpha=1;ctx.fillStyle='#ff5d5d';ctx.beginPath();ctx.arc(0,0,11,Math.PI,0);ctx.lineTo(11,8);ctx.lineTo(5,8);ctx.lineTo(5,0);ctx.arc(0,0,5,0,Math.PI,true);ctx.lineTo(-5,8);ctx.lineTo(-11,8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d6dbe6';ctx.fillRect(-11,8,6,4);ctx.fillRect(5,8,6,4);ctx.restore();
}
function makeBolt(x0,y0,x1,y1){
  const out=[[x0,y0]],n=10,dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  for(let i=1;i<n;i++){const t=i/n,j=(Math.random()-.5)*36*(1-Math.abs(t-.5));out.push([x0+dx*t+nx*j,y0+dy*t+ny*j]);}
  out.push([x1,y1]);return out;
}
function drawClouds(){
  for(const cl of clouds){
    const a=Math.min(1,cl.t*2,(7-cl.t)*3);ctx.globalAlpha=a;
    ctx.fillStyle='#3c3a52';
    [[-34,6,22],[-12,-4,28],[16,-2,25],[38,8,19],[0,10,26]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(cl.x+x,cl.y+y,r,0,7);ctx.fill();});
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(cl.x-12,cl.y-12,18,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
}
function drawBolts(){
  for(const b of bolts){
    const a=Math.min(1,b.t*6);
    ctx.shadowColor='#bfe6ff';ctx.shadowBlur=22;ctx.lineJoin='round';ctx.lineCap='round';
    for(const[w,col]of[[7,'rgba(160,210,255,'+(a*.6)+')'],[3,'rgba(255,255,255,'+a+')']]){
      ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();b.path.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
}
function drawHoles(){
  for(const bh of holes){
    const grow=Math.min(1,(4-bh.t)*3,bh.t*3),r=34*grow;
    const g=ctx.createRadialGradient(bh.x,bh.y,r*.2,bh.x,bh.y,r*2.2);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.45,'rgba(60,20,110,.75)');g.addColorStop(1,'rgba(60,20,110,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bh.x,bh.y,r*2.2,0,7);ctx.fill();
    ctx.strokeStyle='rgba(200,160,255,.6)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){const a=simTime*5+i*2.1;ctx.beginPath();ctx.arc(bh.x,bh.y,r*(.9+i*.35),a,a+1.4);ctx.stroke();}
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bh.x,bh.y,r*.55,0,7);ctx.fill();
  }
}
function drawZap(){
  if(!zap)return;
  ctx.strokeStyle='#fff7a8';ctx.lineWidth=2.5;ctx.shadowColor='#ffe94d';ctx.shadowBlur=12;
  for(let k=0;k<3;k++){
    const t=pts[(Math.random()*N)|0];let x=zap.x,y=zap.y;
    ctx.beginPath();ctx.moveTo(x,y);
    for(let s=1;s<=6;s++){x=zap.x+(t.x-zap.x)*s/6+(s<6?(Math.random()-.5)*16:0);y=zap.y+(t.y-zap.y)*s/6+(s<6?(Math.random()-.5)*16:0);ctx.lineTo(x,y);}
    ctx.stroke();
  }
  ctx.shadowBlur=0;
}

// ---------- loop ----------
function resize(){
  const r=stage.getBoundingClientRect(),cw=Math.max(200,r.width),ch=Math.max(200,r.height);DPR=Math.min(2,window.devicePixelRatio||1);
  VS=Math.max(.68,Math.min(1,Math.min(cw,ch*1.25)/600));W=cw/VS;H=ch/VS;
  cv.width=cw*DPR;cv.height=ch*DPR;ctx.setTransform(DPR*VS,0,0,DPR*VS,0,0);
}
let last=0,acc=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||FIX);last=t;acc+=dt;
  if(paused)acc=0;
  while(acc>=FIX){for(let s=0;s<SUB;s++)step(FIX/SUB);think(FIX);acc-=FIX;}
  if(lp&&!lp.open&&ptr.down&&!grab&&!pinch&&performance.now()-lp.t0>550){lp.open=true;aim=null;sfx.pop();}
  playMusic(dt);
  ctx.save();ctx.translate(cam.x,cam.y);ctx.scale(cam.z,cam.z);if(shakeT>0){shakeT-=dt;if(save.calm)shakeT=0;const m=shakeT*22;ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);}
  drawRoom();drawPlats();drawFixtures();drawHoles();drawClouds();drawTrails();for(const o of objs)drawObj(o);drawBlob();drawBubble();drawCritters();drawZap();drawBolts();drawGame();drawParts();drawNight();drawAim();drawMagnet();drawSplats();drawStickers();ctx.restore();drawRadial();
  if(flashT>0&&!save.calm){ctx.fillStyle='rgba(235,245,255,'+Math.min(.7,flashT*5)+')';ctx.fillRect(0,0,W,H);}syncBars();
  requestAnimationFrame(frame);
}
function start(data){
  loadSave();if(data&&data.save)Object.assign(save,data.save);
  for(const[k,v]of Object.entries({looks:[],rooms:['night'],stats:{},ach:[],best:{}}))if(!save[k])save[k]=v;
  for(const[k,v]of Object.entries({trust:0,volume:1,calm:false,lastDay:'',streak:0,music:false,recent:[]}))if(save[k]===undefined)save[k]=v;
  {const today=new Date().toDateString();
   if(save.lastDay!==today){
     const yest=new Date(Date.now()-864e5).toDateString();
     save.streak=save.lastDay===yest?(save.streak||0)+1:1;save.lastDay=today;
     const gift=20+10*Math.min(save.streak,7);save.coins+=gift;statMax('streak',save.streak);persist();
     toast('Daily gift: +'+gift+' coins'+(save.streak>1?' ('+save.streak+'-day streak)':''));
   }
   if(!save.daily||save.daily.day!==today){let h=0;for(const ch of today)h=(h*31+ch.charCodeAt(0))>>>0;const i=h%DAILY.length;save.daily={day:today,i,base:save.stats[DAILY[i].stat]||0,done:false};persist();}}
  if(save.unlocked.includes('hat')&&!save.looks.includes('party')){save.looks.push('party');if(save.hat)save.hatId='party';}
  save.hat=false;if(!save.rooms.includes(save.room))save.room='night';
  $('nameInput').value=save.name;syncMute();
  resize();new ResizeObserver(()=>{resize();clampCam();keepInside();}).observe(stage);
  initBlob(W*.42,floorY()-R-4);
  loadLayout();
  // a starter ball so the room isn't empty
  spawn('snack',W*.62,floorY()-60);
  buildTray();setHint();
  setTimeout(()=>say('hello',true),500);
  requestAnimationFrame(t=>{last=t;frame(t);});
}
window.addEventListener('pagehide',flushSave);
window.claude?.hot?.snapshot?.(()=>({save}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
