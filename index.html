<style>
/* Layout: one-screen toy. Header strip (name, mood, health, coins) / stage canvas / scrolling tool tray. Single dark "night playroom" look. */
:root{
  --room:#17142a;
  --stage-top:#241f45;
  --stage-bot:#30295c;
  --floor:#3d3270;
  --floor-edge:#5a4a9a;
  --chip:#262044;
  --chip-hi:#352d5e;
  --ink:#f4effd;
  --muted:#a69ec7;
  --gold:#ffc24b;
  --mood:#79e3b6;
  --health:#ff7d8e;
  --line:#3e3668;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--room);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.name{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed transparent;
  width:7.5em;min-width:0;padding:2px 0;outline:none}
.name:hover{border-bottom-color:var(--line)}
.name:focus-visible{border-bottom-color:var(--gold)}
.bars{display:flex;gap:14px;flex:1 1 260px;min-width:0}
.bar{flex:1;min-width:0;display:grid;gap:3px}
.bar label{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bar label span{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.fill{height:100%;border-radius:6px;transition:width .25s}
#moodFill{background:var(--mood)}
#healthFill{background:var(--health)}
.right{display:flex;align-items:center;gap:8px}
.coins{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums;min-width:4.2em}
.coins i{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -3px 0 #c98a1a;display:inline-block}
.btn{font:inherit;font-weight:700;font-size:.85rem;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer}
.btn:hover{background:var(--chip-hi)}
.btn:focus-visible,.tool:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:linear-gradient(var(--stage-top),var(--stage-bot));box-shadow:inset 0 0 0 1px var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);font-size:.82rem;color:var(--ink);background:rgba(23,20,42,.6);padding:5px 10px;border-radius:10px;pointer-events:none;text-wrap:balance}
.hint:empty{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--room);border-color:var(--ink)}
.glist{display:grid;gap:8px}
.gcard.done{border-color:var(--gold)}
.gcard .meter{grid-column:1 / -1;height:6px;border-radius:4px;background:var(--chip);overflow:hidden}
.gcard .meter i{display:block;height:100%;background:var(--gold)}
.gcard .tag{grid-row:1 / span 2;grid-column:2;font-weight:800;font-size:.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.stats div{background:var(--room);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.78rem;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--room);font-weight:800;font-size:.85rem;
  padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.tool{min-width:0;display:grid;justify-items:center;gap:2px;padding:5px 2px 4px;border-radius:14px;background:var(--chip);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:.66rem;font-weight:800;line-height:1.15;cursor:pointer;position:relative;text-align:center}
.tool span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool svg{width:22px;height:22px}
.tool:hover{background:var(--chip-hi)}
.tool.on{background:var(--ink);color:var(--room);border-color:var(--ink)}
.tool.locked{color:var(--muted)}
.tool.locked svg{opacity:.45}
.tool .price{color:var(--gold);font-variant-numeric:tabular-nums}
.tool.arm{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.tool.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.update{position:absolute;right:12px;top:12px;max-width:min(320px,calc(100% - 24px));background:var(--chip);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:grid;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.update strong{font-family:var(--display);font-weight:400;font-size:1.1rem}
.update p{margin:0;color:var(--muted);font-size:.85rem}
.updRow{display:flex;flex-wrap:wrap;gap:6px}
.updRow a.btn{text-decoration:none}
.gpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;box-sizing:border-box;
  background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.gpanel h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.4rem;text-wrap:balance}
.gpanel p{margin:0;color:var(--muted);font-size:.88rem}
.gcard{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:10px 12px;border-radius:12px;background:var(--room);border:1px solid var(--line)}
.gcard b{font-size:1rem}
.gcard small{grid-column:1;color:var(--muted);font-size:.8rem}
.gcard .best{color:var(--gold);font-variant-numeric:tabular-nums}
.gcard .btn{grid-row:1 / span 2;grid-column:2}
.gbig{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.hud{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--room);
  border-radius:999px;padding:6px 8px 6px 16px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .btn{padding:3px 10px;font-size:.78rem}
@media (max-width:520px){.name{font-size:1.3rem}.tray{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}}
@media (prefers-reduced-motion:reduce){.tool.shake{animation:none}.fill{transition:none}}
</style>

<div class="app">
  <header>
    <input class="name" id="nameInput" value="Gloop" maxlength="14" aria-label="Creature name" spellcheck="false">
    <div class="bars">
      <div class="bar"><label>Mood <span id="moodNum">60</span></label><div class="track"><div class="fill" id="moodFill" style="width:60%"></div></div></div>
      <div class="bar"><label>Health <span id="healthNum">100</span></label><div class="track"><div class="fill" id="healthFill" style="width:100%"></div></div></div>
    </div>
    <div class="right">
      <div class="coins" title="Coins"><i></i><span id="coinNum">10</span></div>
      <button class="btn" id="gamesBtn">Games</button>
      <button class="btn" id="shopBtn">Shop</button>
      <button class="btn" id="trophyBtn">Trophies</button>
      <button class="btn" id="clearBtn">Clear items</button>
      <button class="btn" id="muteBtn" aria-pressed="false">Sound on</button>
      <button class="btn" id="updateBtn" title="Check GitHub for a newer version">Update</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" hidden></div>
    <div class="hud" id="hud" hidden><span id="hudName"></span><span id="hudScore"></span><span id="hudTime"></span><button class="btn" id="hudQuit">Quit</button></div>
    <div class="gpanel" id="gamePanel" hidden></div>
    <div class="update" id="updatePanel" hidden>
      <strong id="updTitle">Update available</strong>
      <p id="updText"></p>
      <div class="updRow">
        <button class="btn" id="updPlay">Play new version</button>
        <a class="btn" id="updSave" download="index.html">Save new file</a>
        <button class="btn" id="updClose">Not now</button>
      </div>
    </div>
  </div>
  <nav class="tray" id="tray" aria-label="Tools"></nav>
</div>

    limbs.push(Object.assign({seg,nodes},d));
  }
}
function limbConstraints(c){
  for(const L of limbs){
    const a=pts[L.anchor!==undefined?L.anchor:L.a];
    let ox=a.x-c.x,oy=a.y-c.y;const od=Math.hypot(ox,oy)||1;ox/=od;oy/=od;
    let dx=ox,dy=oy+(L.kind==='leg'?1.3:.7)*gravSign;
    let th=0;
    if(L.kind==='arm'&&wave>0)th=-L.side*(1.9+.5*Math.sin(simTime*16+L.side));
    if(L.kind==='leg'&&kick>0)th=-L.side*.7*Math.sin(simTime*22);
    if(th){const cs=Math.cos(th),sn=Math.sin(th),nx=dx*cs-dy*sn;dy=dx*sn+dy*cs;dx=nx;}
    const dd=Math.hypot(dx,dy)||1;dx/=dd;dy/=dd;
    const k=ko>0?0:(L.kind==='leg'?.22:.14);
    let prev=a,prevW=.35;
    for(const q of L.nodes){
      const ex=q.x-prev.x,ey=q.y-prev.y,d=Math.hypot(ex,ey)||1,df=(d-L.seg)/d;
      q.x-=ex*df*(1-prevW);q.y-=ey*df*(1-prevW);prev.x+=ex*df*prevW;prev.y+=ey*df*prevW;
      if(k&&!(grab&&grab.ref===q)){q.x+=(prev.x+dx*L.seg-q.x)*k;q.y+=(prev.y+dy*L.seg-q.y)*k;}
      prev=q;prevW=.5;
    }
  }
}
function limbNodes(){const out=[];for(const L of limbs)for(const q of L.nodes)out.push(q);return out;}
function nearLimb(x,y,r){let best=null,bd=r;for(const q of limbNodes()){const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;best=q;}}return best;}

let actx=null;
function tone(f,d=.12,type='sine',vol=.08,slide=0){
  if(save.muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

// ---------- persistence ----------
let saveT=0;
function persist(){saveT=1;}
function flushSave(){try{localStorage.setItem('gloopbox',JSON.stringify(save));}catch(e){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem('gloopbox')||'null');if(s&&typeof s==='object')Object.assign(save,s);}catch(e){}}

// ---------- helpers ----------
function centroid(){let x=0,y=0;for(const p of pts){x+=p.x;y+=p.y;}return{x:x/N,y:y/N};}
function area(){let a=0;for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];a+=p.x*q.y-q.x*p.y;}return Math.abs(a)/2;}
function inside(x,y){let c=false;for(let i=0,j=N-1;i<N;j=i++){const a=pts[i],b=pts[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))c=!c;}return c;}
function nearestPt(x,y){let best=null,bd=1e9;for(const p of pts){const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=p;}}return{p:best,d:bd};}
function say(kind,force){if(!force&&lineCD>0)return;bubble={text:pick(LINES[kind]),t:2.2};lineCD=1.6;}
// ---------- stats & achievements ----------
function stat(k,inc=1){save.stats[k]=(save.stats[k]||0)+inc;checkAch();persist();}
function statMax(k,v){if(v>(save.stats[k]||0)){save.stats[k]=v;checkAch();persist();}}
function checkAch(){
  for(const a of ACH){
    if(save.ach.includes(a.id))continue;
    if((save.stats[a.stat]||0)>=a.goal){
      save.ach.push(a.id);save.coins+=a.reward;sfx.buy();
      toast('Trophy: '+a.name+' (+'+a.reward+' coins)');
      parts.push({k:'txt',x:W/2,y:60,vx:0,vy:-20,t:2,text:'🏆 '+a.name,c:'#ffc24b'});
    }
  }
}
function addCoins(n,x,y){stat('coinsEarned',n);save.coins+=n;parts.push({k:'txt',x,y,vx:0,vy:-40,t:1.2,text:'+'+n,c:'#ffc24b'});sfx.coin();persist();}
function hurt(dmg,big){
  if(ko>0||dmg<=0)return;
  health=Math.max(0,health-dmg);mood=Math.max(0,mood-dmg*1.1);hurtT=.6;fearT=8;
  // combos: hits landing within 1.5s of each other chain up and pay out
  combo=comboT>0?combo+1:1;comboT=1.5;statMax('bestCombo',combo);
  if(combo>=3){const c0=centroid();parts.push({k:'txt',x:c0.x,y:c0.y-R-30,vx:0,vy:-30,t:.9,text:'COMBO x'+combo,c:'#ffe07a'});
    if(combo%5===0){addCoins(combo/5*3,c0.x,c0.y-R-50);say('combo',true);}}
  const c=centroid();for(let i=0;i<Math.min(8,2+dmg/3);i++)parts.push({k:'star',x:c.x+(Math.random()-.5)*50,y:c.y-20,vx:(Math.random()-.5)*160,vy:-80-Math.random()*120,t:.8});
  sfx.ouch();
  if(health<=0){knockOut();return;}
  say(big||dmg>12?'big':'ouch',true);
}
let shakeT=0;
function slam(dv,c){
  // dust puff where it hit, a screen shake, a squashed face; really hard slams knock it out cold
  const fy=floorY(),onFloor=gravSign>0?pts.some(p=>p.y>fy-8):pts.some(p=>p.y<16);
  const hx=c.x,hy=onFloor?(gravSign>0?fy:10):c.y;
  for(let i=0;i<Math.min(16,4+dv/2);i++)parts.push({k:'smoke',x:hx+(Math.random()-.5)*60,y:hy-4*gravSign,vx:(Math.random()-.5)*220,vy:-Math.random()*60*gravSign,t:.4+Math.random()*.3,r:3+Math.random()*4});
  shakeT=Math.min(.45,dv/70);sfx.boing();
  if(dv>34&&ko<=0){hurt(18,true);parts.push({k:'txt',x:hx,y:c.y-R-20,vx:0,vy:-40,t:1,text:'SPLAT!',c:'#f4effd'});if(ko<=0)knockOut();stat('slamKOs');return;}
  hurt(Math.round(Math.min(30,(dv-15)*1.3+3)),dv>24);
  if(dv>24)parts.push({k:'txt',x:hx,y:c.y-R-20,vx:0,vy:-40,t:.9,text:pick(['THUD!','SMACK!','WHAM!']),c:'#f4effd'});
}
function knockOut(){if(ko>0)return;ko=6;bubble={text:pick(LINES.ko),t:5.5};lineCD=6;stat('kos');}
function impulse(p,vx,vy){p.px-=vx;p.py-=vy;}
function floorY(){return H-FLOOR_H;}

// ---------- spawning ----------
function spawn(type,x,y){
  if(objs.length>45)objs.shift();
  const spec={
    snack:{r:9,m:.6,b:.3,f:.9},ball:{r:16,m:2,b:.85,f:.98},crate:{r:20,m:6,b:.15,f:.7},
    anvil:{r:24,m:40,b:.05,f:.6},firecracker:{r:10,m:1,b:.3,f:.85,fuse:1.6},
    bowling:{r:19,m:22,b:.08,f:.95},cactus:{r:18,m:14,b:.05,f:.4},rocket:{r:9,m:2,b:.2,f:.9,life:3.5},
    gold:{r:11,m:.5,b:.2,f:.9,life:2.5},chili:{r:10,m:.5,b:.2,f:.9,life:1.4}
  }[type];
  const o=Object.assign({type,x,y,px:x,py:y,ang:0},spec);
  objs.push(o);return o;
}
function allBody(){return pts.concat(limbNodes());}
function explode(o,RAD=170,dmgMax=28){
  sfx.boom();stat('booms');
  for(const p of allBody()){const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy)||1;if(d<RAD){const s=(1-d/RAD)*16;impulse(p,dx/d*s,dy/d*s-s*.3);}}
  for(const q of objs){if(q===o)continue;const dx=q.x-o.x,dy=q.y-o.y,d=Math.hypot(dx,dy)||1;if(d<RAD){const s=(1-d/RAD)*18/Math.sqrt(q.m);q.px-=dx/d*s;q.py-=dy/d*s+s*.3;}}
  const c=centroid(),d=Math.hypot(c.x-o.x,c.y-o.y);
  if(d<RAD)hurt(Math.round(dmgMax*(1-d/RAD)+4),true);
  for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*260;parts.push({k:'smoke',x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5+Math.random()*.5,r:4+Math.random()*8});}
  parts.push({k:'flash',x:o.x,y:o.y,t:.18});
}

// ---------- physics ----------
function step(h){
  const g=G*gravSign*h*h*(game&&game.id==='keepup'?.5:1), fy=floorY(), top=8, L=8, Rr=W-8;
  const pressK=ko>0?.18:(.45+.4*health/100);
  // integrate blob
  for(const p of pts){const vx=(p.x-p.px)*.996,vy=(p.y-p.py)*.996;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+g;}
  for(const L of limbs)for(const q of L.nodes){const vx=(q.x-q.px)*.99,vy=(q.y-q.py)*.99;q.px=q.x;q.py=q.y;q.x+=vx;q.y+=vy+g;}
  if(grab&&(grab.type==='pt'||grab.type==='limb')){const p=grab.ref;p.x+=(ptr.x-p.x)*.55;p.y+=(ptr.y-p.y)*.55;}
  const lnodes=limbNodes(),bodyAll=pts.concat(lnodes);
  // stay upright: gently turn the body so the feet point toward the floor
  if(ko<=0&&!grab){
    const c0=centroid(),b0=pts[5],b1=pts[6];
    const cur=Math.atan2((b0.y+b1.y)/2-c0.y,(b0.x+b1.x)/2-c0.x);
    let diff=(gravSign>0?Math.PI/2:-Math.PI/2)-cur;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const rot=Math.max(-.05,Math.min(.05,diff*(grounded()?.12:.05)));
    if(Math.abs(rot)>.0005){
      const cs=Math.cos(rot),sn=Math.sin(rot);
      for(const p of bodyAll){
        let x=p.x-c0.x,y=p.y-c0.y;p.x=c0.x+x*cs-y*sn;p.y=c0.y+x*sn+y*cs;
        x=p.px-c0.x;y=p.py-c0.y;p.px=c0.x+x*cs-y*sn;p.py=c0.y+x*sn+y*cs;
      }
    }
  }
  // black holes pull everything in
  for(const bh of holes){
    for(const p of bodyAll.concat(objs)){
      const dx=bh.x-p.x,dy=bh.y-p.y,d=Math.hypot(dx,dy)||1;
      if(d<320){const a=Math.min(9000,700000/(d+40))*h*h/(p.m?Math.sqrt(p.m):1);p.x+=dx/d*a;p.y+=dy/d*a;}
    }
  }
  // integrate objects
  for(const o of objs){
    if(o.held)continue;
    const vx=(o.x-o.px)*.998,vy=(o.y-o.py)*.998;o.px=o.x;o.py=o.y;o.x+=vx;o.y+=vy+((o.type==='gold'||o.type==='chili')?g*.3:g);
    if(grab&&grab.ref===o){o.x+=(ptr.x-o.x)*.5;o.y+=(ptr.y-o.y)*.5;}
    o.ang+=vx/o.r;
  }
  const seg=2*R*Math.sin(Math.PI/N), seg2=2*R*Math.sin(2*Math.PI/N);
  for(let it=0;it<4;it++){
    // edges
    for(let i=0;i<N;i++){
      link(pts[i],pts[(i+1)%N],seg,.9);
      link(pts[i],pts[(i+2)%N],seg2,.25);
    }
    // pressure + shape memory
    const c=centroid(),A=area(),diff=(A0-A)/A0;
    for(let i=0;i<N;i++){
      const p=pts[i],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy)||1;
      const push=diff*pressK*R*.22;
      p.x+=dx/d*push;p.y+=dy/d*push;
      const k=ko>0?.004:.018;const s=(R-d)*k;p.x+=dx/d*s;p.y+=dy/d*s;
    }
    limbConstraints(c);
    // blob + limbs vs objects
    for(const o of objs){
      if(o.held)continue;
      for(const p of bodyAll){
        const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);const min=o.r+3;
        if(d<min&&d>0){
          const ov=min-d,nx=dx/d,ny=dy/d,wp=o.m/(o.m+1),wo=1/(o.m+1);
          p.x+=nx*ov*wp;p.y+=ny*ov*wp;o.x-=nx*ov*wo;o.y-=ny*ov*wo;
          const sp=Math.hypot(o.x-o.px,o.y-o.py)*Math.sqrt(o.m);
          if(sp>frameHit&&o.type!=='snack'&&o.type!=='gold'&&o.type!=='chili')frameHit=sp;
          if(o.type==='cactus')cactusTouch=true;
          if(o.type==='snack'||o.type==='gold'||o.type==='chili')o.touched=true;
          if(o.type==='rocket')o.hit=true;
          if(o.type==='ball')o.touched=true;
        }
      }
    }
    // object vs object
    for(let i=0;i<objs.length;i++)for(let j=i+1;j<objs.length;j++){
      const a=objs[i],b=objs[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
      if(d<min&&d>0&&!a.held&&!b.held){const ov=min-d,nx=dx/d,ny=dy/d,wa=b.m/(a.m+b.m),wb=a.m/(a.m+b.m);a.x-=nx*ov*wa;a.y-=ny*ov*wa;b.x+=nx*ov*wb;b.y+=ny*ov*wb;}
    }
    // bounds
    const slick=game&&game.id!=='keepup';
    for(const p of pts)bound(p,3,.25,slick?.97:.82,top,fy,L,Rr);
    for(const q of lnodes)bound(q,4,.2,slick?.97:.7,top,fy,L,Rr);
    for(const o of objs)if(!o.held)bound(o,o.r,o.b,o.f,top,fy,L,Rr);
  }
}
let frameHit=0;
function link(a,b,rest,k){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,diff=(d-rest)/d*.5*k;
  a.x+=dx*diff;a.y+=dy*diff;b.x-=dx*diff;b.y-=dy*diff;
}
function bound(p,r,bounce,fric,top,fy,L,Rr){
  const vx=p.x-p.px,vy=p.y-p.py;
  if(p.y>fy-r){p.y=fy-r;p.py=p.y+vy*bounce;p.px=p.x-vx*fric;}
  if(p.y<top+r){p.y=top+r;p.py=p.y+vy*bounce;p.px=p.x-vx*fric;}
  if(p.x<L+r){p.x=L+r;p.px=p.x+vx*bounce;}
  if(p.x>Rr-r){p.x=Rr-r;p.px=p.x+vx*bounce;}
}

// ---------- behaviour ----------
function grounded(){
  if(gravSign>0){const fy=floorY();return pts.some(p=>p.y>fy-6);}
  return pts.some(p=>p.y<14);
}
function think(dt){
  const c=centroid();
  // impact damage from sudden velocity change
  if(cPrev){
    const v={x:c.x-cPrev.x,y:c.y-cPrev.y},dv=Math.hypot(v.x-vPrev.x,v.y-vPrev.y);
    if(!game&&!holes.length&&!(grab&&(grab.type==='pt'||grab.type==='limb'))&&dv>15&&hitCD<=0){slam(dv,c);hitCD=.35;}
    vPrev=v;
  }
  cPrev=c;
  if(frameHit>7&&hitCD<=0){hurt(Math.round(Math.min(35,(frameHit-7)*.9+2)),frameHit>20);hitCD=.4;}
  frameHit=0;
  if(cactusTouch&&hitCD<=0&&ko<=0){hurt(4);say('prickly',true);hitCD=.5;}
  cactusTouch=false;
  // zapper
  if(zap){
    zap.t-=dt;zap.tick-=dt;
    for(const p of allBody())impulse(p,(Math.random()-.5)*3,(Math.random()-.5)*3);
    if(zap.tick<=0){zap.tick=.15;health=Math.max(0,health-2);mood=Math.max(0,mood-2);hurtT=.3;fearT=8;if(health<=0)knockOut();}
    if(zap.t<=0)zap=null;
  }
  // rockets home in on the body
  for(let i=objs.length-1;i>=0;i--){
    const o=objs[i];if(o.type!=='rocket')continue;
    o.life-=dt;
    const dx=c.x-o.x,dy=c.y-o.y,d=Math.hypot(dx,dy)||1;
    if(!(grab&&grab.ref===o)){const vx=o.x-o.px,vy=o.y-o.py,tvx=dx/d*6,tvy=dy/d*6;o.px=o.x-(vx+(tvx-vx)*.12);o.py=o.y-(vy+(tvy-vy)*.12)+G*gravSign*SUB/((60*SUB)*(60*SUB));}
    o.dir=Math.atan2(o.y-o.py,o.x-o.px);
    parts.push({k:'smoke',x:o.x-Math.cos(o.dir)*10,y:o.y-Math.sin(o.dir)*10,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,t:.4,r:3});
    if(o.hit||d<R+o.r||o.life<=0){objs.splice(i,1);if(grab&&grab.ref===o)grab=null;explode(o,120,20);}
  }
  // black holes
  for(let i=holes.length-1;i>=0;i--){
    const bh=holes[i];bh.t-=dt;bh.tick-=dt;
    if(Math.hypot(c.x-bh.x,c.y-bh.y)<70&&bh.tick<=0){bh.tick=.4;hurt(3);if(Math.random()<.4)say('hole',true);}
    if(bh.t<=0){
      holes.splice(i,1);sfx.pop();
      for(const p of allBody()){const dx=p.x-bh.x,dy=p.y-bh.y,d=Math.hypot(dx,dy)||1;if(d<200)impulse(p,dx/d*6,dy/d*6);}
      for(let k=0;k<20;k++){const a=Math.random()*7,s=60+Math.random()*200;parts.push({k:'smoke',x:bh.x,y:bh.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.6,r:3+Math.random()*5});}
    }
  }
  if(game)gameTick(dt,c);
  comboT-=dt;fearT-=dt;
  statMax('maxMood',Math.round(mood));
  // fear: after being hurt, Gloop backs away from a pointer that's holding a weapon
  if(!game&&ko<=0&&!grab&&WEAPONS.includes(tool)&&ptr.x>-500&&(fearT>0||mood<35)){
    const d=Math.hypot(ptr.x-c.x,ptr.y-c.y);
    if(d<240){
      steer(c.x-Math.sign(ptr.x-c.x||1)*260,dt);
      for(const p of pts)impulse(p,(Math.random()-.5)*.6,0);
      if(Math.random()<dt*.6)say('scared');
    }
  }
  // sparkle trail
  if(save.trail==='sparkle'&&cPrev&&Math.hypot(vPrev.x,vPrev.y)>3&&Math.random()<.7)
    parts.push({k:'glit',x:c.x+(Math.random()-.5)*R,y:c.y+(Math.random()-.5)*R,vx:0,vy:0,t:.7,h:(simTime*200+Math.random()*80)%360});
  hitCD-=dt;hurtT-=dt;tickleT-=dt;lineCD-=dt;
  simTime+=dt;wave-=dt;kick-=dt;
  if(tickleT>0||(bubble&&bubble.t>1.6&&ko<=0&&hurtT<=0))wave=Math.max(wave,.3);
  if(ko<=0&&mood>82&&Math.random()<dt*.15)wave=1.2;

  if(ko>0){
    ko-=dt;
    if(ko<=0){health=40;mood=Math.max(mood,30);say('wake',true);sfx.boing();}
  }else{
    health=Math.min(100,health+dt*1.5);
    mood+=(50-mood)*dt*.015;
    if(health<30)mood=Math.max(0,mood-dt*1.5);
    // passive coins
    coinT-=dt;
    if(coinT<=0){coinT=save.coins<20?2.5:5;if(mood>60||save.coins<20){const top=pts.reduce((a,p)=>p.y<a.y?p:a);addCoins(mood>85?2:1,top.x,top.y-18);}}
    // hops
    // waddle toward the nearest snack it can see
    if(!game&&!grab&&health>15){
      let best=null,bd=380;
      for(const o of objs)if(o.type==='snack'&&!(grab&&grab.ref===o)){const d=Math.abs(o.x-c.x);if(d<bd){bd=d;best=o;}}
      if(best){steer(best.x,dt);if(Math.random()<dt*.5)say('happy');}
    }
    hopT-=dt;
    if(hopT<=0&&!game){
      hopT=1.6+Math.random()*(mood>70?2.5:5);
      if(grounded()&&!grab&&mood>35&&health>25){
        const up=(mood>75?3.4:2.6)*gravSign;let side=0;
        if(ptr.x>-500&&mood>55)side=Math.sign(ptr.x-c.x)*Math.min(1.4,Math.abs(ptr.x-c.x)/120);
        else side=(Math.random()-.5)*1.6;
        for(const p of pts)impulse(p,side,-up);
        for(const q of limbNodes())impulse(q,side,-up);
        kick=.45;
        if(mood>75&&Math.random()<.4)say('happy');
      }else if(mood<25&&Math.random()<.5)say('sad');
    }
    // eat snacks
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i];
      if(o.type==='snack'&&(o.touched||Math.hypot(o.x-c.x,o.y-c.y)<R+o.r+10)&&!(grab&&grab.ref===o)){
        objs.splice(i,1);mood=Math.min(100,mood+12);health=Math.min(100,health+10);say('eat',true);sfx.nom();stat('snacks');
        for(let k=0;k<6;k++)parts.push({k:'crumb',x:o.x,y:o.y,vx:(Math.random()-.5)*120,vy:-60-Math.random()*80,t:.6});
      }
    }
  }
  // firecracker fuses
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.type==='firecracker'){o.fuse-=dt;if(Math.random()<.6)parts.push({k:'spark',x:o.x,y:o.y-o.r,vx:(Math.random()-.5)*90,vy:-40-Math.random()*90,t:.3});if(o.fuse<=0){objs.splice(i,1);if(grab&&grab.ref===o)grab=null;explode(o);}}}
  // blink
  blinkT-=dt;if(blinkT<=0){blinking=.12;blinkT=2+Math.random()*4;}blinking-=dt;
  if(bubble){bubble.t-=dt;if(bubble.t<=0)bubble=null;}
  // particles
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t-=dt;if(q.t<=0){parts.splice(i,1);continue;}
    if(q.vx!==undefined){q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.k==='star'||q.k==='crumb')q.vy+=500*dt;if(q.k==='smoke'){q.vx*=.92;q.vy*=.92;}if(q.k==='heart')q.vy-=10*dt;}}
  if(armed){armTimer-=dt;if(armTimer<=0){armed=null;buildTray();}}
  if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').hidden=true;}
  if(saveT>0){saveT-=dt;if(saveT<=0)flushSave();}
}

// ---------- mini-games ----------
const GAMES=[
 {id:'keepup',name:'Keep-up',desc:'Tap near NAME to bounce it. Don\'t let it touch the floor. It floats a little in this game.',unit:'bounces'},
 {id:'rain',name:'Snack Rain',desc:'NAME slides under your cursor or finger (arrow keys and A/D work too). Catch gold snacks, dodge the chilis. 30 seconds.',unit:'snacks'},
 {id:'fetch',name:'Fetch',desc:'Grab the ball with the Hand and fling it. NAME runs after it and brings it back. 45 seconds.',unit:'fetches'}
];
function dash(tx,maxV){
  // direct horizontal drive for games: snappy, no hopping needed
  const c=centroid(),tv=Math.max(-maxV,Math.min(maxV,(tx-c.x)*.06));
  for(const q of allBody()){const vx=q.x-q.px;q.px=q.x-(vx+(tv-vx)*.3);}
}
let keyDir=0;const keys={};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=1;if(k==='arrowright'||k==='d')keys.r=1;keyDir=(keys.r||0)-(keys.l||0);if(game&&game.id==='rain'&&(k.startsWith('arrow')))e.preventDefault&&e.preventDefault();});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=0;if(k==='arrowright'||k==='d')keys.r=0;keyDir=(keys.r||0)-(keys.l||0);});
function steer(tx,dt){
  const c=centroid(),f=Math.max(-.5,Math.min(.5,(tx-c.x)*.006))*(game?.5:.25);
  for(const q of allBody())impulse(q,f,0);
  if(grounded()&&Math.abs(tx-c.x)>30&&Math.random()<dt*(game?5:3)){for(const q of allBody())impulse(q,Math.sign(tx-c.x)*1.4,-2.8*gravSign);kick=.4;}
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function showGames(){
  const p=$('gamePanel');p.innerHTML='';

$('gamesBtn').onclick=()=>togglePanel(showGames);
$('hudQuit').onclick=()=>endGame(true);
function startGame(id){
  if(ko>0){toast(nm()+' needs a moment to wake up');return;}
  $('gamePanel').hidden=true;
  const def=GAMES.find(g=>g.id===id);
  game={id,def,score:0,state:'wait',t2:0,carriedBy:false,t:id==='rain'?30:id==='fetch'?45:0,spawnT:.5,grace:1,held:0,armed:false,ball:null};
  holes=[];zap=null;objs=objs.filter(o=>o.type!=='rocket'&&o.type!=='firecracker');
  if(id==='keepup'){for(const q of allBody())q.py=q.y+6*gravSign;}
  if(id==='fetch'){tool='hand';buildTray();const c=centroid();game.ball=spawn('ball',Math.max(30,Math.min(W-30,c.x+90)),c.y-60);}
  say('game',true);wave=1;stat('games');
  $('hint').textContent=def.desc.replace('NAME',nm());
  $('hudName').textContent=def.name;$('hud').hidden=false;updHud();
}
function updHud(){if(!game)return;$('hudScore').textContent=game.score+' '+game.def.unit;$('hudTime').textContent=game.t>0?Math.ceil(game.t)+'s':'';}
function gameTick(dt,c){
  const g=game;
  if(g.id==='keepup'){
    g.grace-=dt;
    if(g.grace<=0&&grounded()){endGame();return;}
  }else{g.t-=dt;if(g.t<=0){endGame();return;}}
  if(g.id==='rain'){
    // Snack Rain rules: Gloop slides straight under your cursor/finger (or arrow keys / A-D)
    const tx=keyDir?c.x+keyDir*400:(ptr.x>-500?ptr.x:null);
    if(tx!==null)dash(tx,7);
    g.spawnT-=dt;
    if(g.spawnT<=0){g.spawnT=.4+Math.random()*.35;spawn(Math.random()<.15?'chili':'gold',20+Math.random()*(W-40),gravSign>0?24:floorY()-24);}
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i];if(o.type!=='gold'&&o.type!=='chili')continue;
      if(o.touched||Math.hypot(o.x-c.x,o.y-c.y)<R+o.r+20){
        objs.splice(i,1);
        if(o.type==='gold'){g.score++;sfx.coin();parts.push({k:'txt',x:o.x,y:o.y-10,vx:0,vy:-50,t:.8,text:'+1',c:'#ffc24b'});}
        else{g.score=Math.max(0,g.score-2);hurtT=.5;say('hot',true);sfx.ouch();parts.push({k:'txt',x:o.x,y:o.y-10,vx:0,vy:-50,t:.8,text:'-2',c:'#ff7d8e'});}
      }else if(o.y>floorY()-o.r-2||o.y<o.r+10){o.life-=dt;if(o.life<=0)objs.splice(i,1);}
    }
  }
  if(g.id==='fetch'){
    // States: waiting for a throw -> chasing -> carrying it back -> drops it at your side
    let b=g.ball;
    if(!b||!objs.includes(b)){b=g.ball=spawn('ball',Math.max(30,Math.min(W-30,c.x+90)),c.y-60);g.state='wait';}
    const carried=grab&&grab.ref===b;
    if(carried){b.held=false;g.state='wait';g.carriedBy=true;}
    const d=Math.hypot(b.x-c.x,b.y-c.y),speed=Math.hypot(b.x-b.px,b.y-b.py);
    if(g.state==='wait'){
      // armed once you've thrown it (let go of a moving ball) or it's far away
      if(!carried&&(g.carriedBy&&speed>.8||d>160)){g.state='chase';g.carriedBy=false;}
    }else if(g.state==='chase'){
      if(!carried)dash(b.x,5);
      if(!carried&&(b.touched||d<R+b.r+14)){
        g.score++;g.state='carry';g.t2=.7;b.held=true;mood=Math.min(100,mood+4);say('fetch',true);sfx.coin();wave=.8;
      }
    }else if(g.state==='carry'){
      const hand=limbs[0].nodes[limbs[0].nodes.length-1];
      b.x=hand.x;b.y=hand.y-(b.r+2)*gravSign;b.px=b.x;b.py=b.y;
      if(ptr.x>-500&&Math.abs(ptr.x-c.x)>90)dash(ptr.x,4);
      g.t2-=dt;
      if(g.t2<=0&&(ptr.x<-500||Math.abs(ptr.x-c.x)<140||g.t2<-2.5)){
        // set it down in front, toward you
        const dir=Math.sign((ptr.x>-500?ptr.x:W/2)-c.x)||1;
        b.held=false;b.x=Math.max(b.r+10,Math.min(W-b.r-10,c.x+dir*(R+b.r+8)));b.y=c.y-10*gravSign;
        b.px=b.x-dir*.8;b.py=b.y+1.2*gravSign;g.state='wait';g.carriedBy=false;
      }
    }
    b.touched=false;
  }
  updHud();
}
function endGame(quit){
  const g=game;if(!g)return;game=null;
  $('hud').hidden=true;setHint();
  objs=objs.filter(o=>o.type!=='gold'&&o.type!=='chili');for(const o of objs)o.held=false;
  if(quit){toast('Game ended');return;}
  const reward=5+(g.id==='keepup'?g.score*2+(g.score>=10?10:0):g.id==='rain'?g.score*2:g.score*4);
  save.best=save.best||{};const prev=save.best[g.id]||0,isBest=g.score>prev;
  if(isBest)save.best[g.id]=g.score;
  statMax('best_'+g.id,g.score);
  if(reward>0){save.coins+=reward;sfx.buy();}
  mood=Math.min(100,mood+Math.min(20,g.score*1.5));persist();
  say(g.score>0?'happy':'sad',true);
  const p=$('gamePanel');p.innerHTML='';
  p.append(el('h2',null,g.def.name+(isBest&&g.score>0?': new best!':'')),el('div','gbig',g.score+' '+g.def.unit),
    el('p',null,'You earned '+reward+' coins. Spend them in the Shop.'+(isBest||!prev?'':' Best is '+prev+'.')));
  const row=el('div','updRow');
  const again=el('button','btn','Play again');again.onclick=()=>startGame(g.id);
  const more=el('button','btn','Other games');more.onclick=showGames;
  const done=el('button','btn','Done');done.onclick=()=>{p.hidden=true;};
  row.append(again,more,done);p.append(row);p.hidden=false;
}

    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Buy for '+price+'?';setTimeout(()=>{b.dataset.arm='';b.textContent=price+' coins';},3000);return;}

// ---------- input ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e);ptr.x=p.x;ptr.y=p.y;ptr.lastX=p.x;ptr.lastY=p.y;ptr.down=true;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(actx&&actx.state==='suspended')actx.resume();
  const onBlob=inside(p.x,p.y)||nearestPt(p.x,p.y).d<16||!!nearLimb(p.x,p.y,14);
  if(game&&game.id==='keepup'){
    const c=centroid();
    if(Math.hypot(p.x-c.x,p.y-c.y)<R*2.3){
      const side=(c.x-p.x)*.06+(W/2-c.x)*.004;
      for(const q of allBody()){q.py=q.y+5.5*gravSign;impulse(q,side*.5,0);}
      game.score++;game.grace=.4;wave=.5;kick=.3;sfx.boing();
      parts.push({k:'txt',x:p.x,y:p.y-20,vx:0,vy:-60,t:.8,text:String(game.score),c:'#f4effd'});
    }
    return;
  }
  if(game&&game.id==='rain')return;
  if(THROWABLE.includes(tool)){
    if(tool==='snack'&&save.coins<2){toast('Snacks cost 2 coins');return;}
    aim={tool,x:p.x,y:p.y};return;
  }
  switch(tool){
    case 'hand':{
      const o=objs.slice().reverse().find(o=>Math.hypot(o.x-p.x,o.y-p.y)<o.r+6);

      const lq=nearLimb(p.x,p.y,18);
      if(lq&&!inside(p.x,p.y)){grab={type:'limb',ref:lq};if(ko<=0&&Math.random()<.4)say('hello');break;}
      const n=nearestPt(p.x,p.y);
      if(n.d<44||inside(p.x,p.y)){grab={type:'pt',ref:n.p};if(ko<=0&&Math.random()<.4)say('hello');}
      break;}
    case 'pin':
      if(onBlob){const n=nearestPt(p.x,p.y),c=centroid(),dx=c.x-n.p.x,dy=c.y-n.p.y,d=Math.hypot(dx,dy)||1;impulse(n.p,dx/d*6,dy/d*6);hurt(6);}
      else{const i=objs.findIndex(o=>o.type==='ball'&&Math.hypot(o.x-p.x,o.y-p.y)<o.r);if(i>=0){objs.splice(i,1);sfx.pop();}}
      break;
    case 'snack':
      if(save.coins<2){toast('Snacks cost 2 coins');break;}
      save.coins-=2;persist();spawn('snack',p.x,p.y);break;
    case 'ball':spawn('ball',p.x,p.y);break;
    case 'crate':spawn('crate',p.x,p.y);break;
    case 'firecracker':spawn('firecracker',p.x,p.y);break;
    case 'anvil':spawn('anvil',p.x,gravSign>0?40:floorY()-40);break;
    case 'paint':if(onBlob){save.color=(save.color+1)%COLORS.length;persist();say('paint',true);sfx.pop();}break;
    case 'hat':if(onBlob){
      const hats=LOOKS.filter(l=>l.kind==='hat'&&save.looks.includes(l.id)).map(l=>l.id).concat([null]);
      save.hatId=hats[(hats.indexOf(save.hatId)+1)%hats.length];persist();if(save.hatId)say('hat',true);sfx.pop();checkOutfit();}break;
    case 'gravity':gravSign*=-1;if(ko<=0)say('flip',true);sfx.boing();stat('flips');break;
    case 'mallet':{
      const c=centroid(),dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;
      parts.push({k:'mallet',x:p.x,y:p.y,a:Math.atan2(dy,dx),t:.25});
      if(d<R*1.7){for(const q of allBody())impulse(q,dx/d*11,dy/d*11-3*gravSign);hurt(9);say('bonk',true);sfx.bonk();stat('bonks');
        parts.push({k:'txt',x:p.x,y:p.y-16,vx:0,vy:-50,t:.8,text:'BONK',c:'#ffe07a'});}
      else sfx.whoosh();
      break;}
    case 'bowling':spawn('bowling',p.x,p.y);break;
    case 'cactus':spawn('cactus',p.x,p.y);break;
    case 'zapper':if(onBlob&&!zap&&ko<=0){zap={t:1,tick:0,x:p.x,y:p.y};combo=comboT>0?combo+1:1;comboT=1.5;statMax('bestCombo',combo);say('zap',true);sfx.zap();stat('zaps');}break;
    case 'rocket':{const o=spawn('rocket',p.x,p.y);const c=centroid(),dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;o.px=o.x-dx/d*2;o.py=o.y-dy/d*2;sfx.whoosh();break;}
    case 'blackhole':if(holes.length<2){holes.push({x:p.x,y:p.y,t:4,tick:0});sfx.hole();stat('holes');}break;
  }
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);const dx=p.x-ptr.x,dy=p.y-ptr.y,dist=Math.hypot(dx,dy);
  ptr.x=p.x;ptr.y=p.y;
  if(ko>0||grab)return;

  const over=inside(p.x,p.y)||!!limbHit;
  if(tool==='feather'&&over&&dist>2){

    const n=nearestPt(p.x,p.y);impulse(n.p,(Math.random()-.5)*2,(Math.random()-.5)*2);

  }
});
function release(e){
  if(aim){
    // flick: the item leaves from the cursor, in the direction you dragged
    const dx=ptr.x-aim.x,dy=ptr.y-aim.y,d=Math.hypot(dx,dy);
    if(aim.tool==='snack'){save.coins-=2;persist();}
    const o=spawn(aim.tool,d>10?ptr.x:aim.x,d>10?ptr.y:aim.y);
    if(d>10){const v=throwVel(dx,dy);o.px=o.x-v.x;o.py=o.y-v.y;sfx.whoosh();}
    aim=null;
  }
  if(grab&&(grab.type==='pt'||grab.type==='limb')&&Math.hypot(vPrev.x,vPrev.y)>12)stat('flings');
  ptr.down=false;grab=null;try{cv.releasePointerCapture(e.pointerId);}catch(_){}}

function drawBlob(){
  const col=COLORS[save.color%COLORS.length];
  const c=centroid();
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,top=pts[0];
  for(const p of pts){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);if(p.y<top.y)top=p;}

  if(gravSign>0){ctx.fillStyle='rgba(0,0,0,'+Math.max(.05,.28-dist/900)+')';ctx.beginPath();ctx.ellipse(c.x,fy+4,(maxX-minX)*.5*Math.max(.4,1-dist/600),6,0,0,7);ctx.fill();}

  ctx.lineCap='round';ctx.lineJoin='round';

    path();ctx.strokeStyle=shade(col,-.04);ctx.lineWidth=thick;ctx.stroke();
    ctx.save();ctx.translate(end.x,end.y);ctx.rotate(Math.atan2(end.y-pen.y,end.x-pen.x));
    ctx.fillStyle=shade(col,.04);ctx.strokeStyle=shade(col,-.32);ctx.lineWidth=2.5;

  // body

  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  let m0=mid(pts[N-1],pts[0]);ctx.moveTo(m0.x,m0.y);

    }else if(save.pattern==='stripes'){

    }

    ctx.closePath();
  }
  ctx.lineWidth=3;ctx.strokeStyle=shade(col,-.32);ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(c.x-R*.38,c.y-R*.42,R*.18,R*.1,-.6,0,7);ctx.fill();

  const eyeL={x:c.x-ex,y:c.y+ey},eyeR={x:c.x+ex,y:c.y+ey};
  const ink=shade(col,-.62);
  ctx.lineCap='round';ctx.lineWidth=3;ctx.strokeStyle=ink;ctx.fillStyle=ink;
  const laughing=tickleT>0;
  if(ko>0){
    for(const e of[eyeL,eyeR]){ctx.beginPath();ctx.moveTo(e.x-5,e.y-5);ctx.lineTo(e.x+5,e.y+5);ctx.moveTo(e.x+5,e.y-5);ctx.lineTo(e.x-5,e.y+5);ctx.stroke();}
  }else if(hurtT>0){
    ctx.beginPath();ctx.moveTo(eyeL.x-6,eyeL.y-5);ctx.lineTo(eyeL.x+4,eyeL.y);ctx.lineTo(eyeL.x-6,eyeL.y+5);ctx.stroke();

      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(e.x,e.y,er,er*1.15,0,0,7);ctx.fill();
      let lx=0,ly=0;
      if(ptr.x>-500){const dx=ptr.x-e.x,dy=ptr.y-e.y,d=Math.hypot(dx,dy)||1;lx=dx/d*Math.min(3.5,d/20);ly=dy/d*Math.min(3.5,d/20);}

      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x+lx+1.5,e.y+ly-1.5,1.3,0,7);ctx.fill();
    }
    if(mood<30){ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(eyeL.x-8,eyeL.y-13);ctx.lineTo(eyeL.x+5,eyeL.y-10);ctx.moveTo(eyeR.x+8,eyeR.y-13);ctx.lineTo(eyeR.x-5,eyeR.y-10);ctx.stroke();}
  }
  // cheeks
  if(mood>65&&ko<=0){ctx.fillStyle='rgba(255,110,140,.35)';ctx.beginPath();ctx.ellipse(eyeL.x-6,eyeL.y+12,5,3,0,0,7);ctx.ellipse(eyeR.x+6,eyeR.y+12,5,3,0,0,7);ctx.fill();}
  // mouth
  const my=c.y+12*sy;ctx.strokeStyle=ink;ctx.lineWidth=3;
  ctx.beginPath();
  if(ko>0){ctx.moveTo(c.x-6,my);ctx.lineTo(c.x+6,my);ctx.stroke();}
  else if(game&&game.id==='rain'&&ko<=0&&hurtT<=0){ctx.fillStyle=shade(col,-.55);ctx.ellipse(c.x,my+3,9,8,0,0,7);ctx.fill();}
  else if(hurtT>0||laughing){ctx.fillStyle=shade(col,-.55);ctx.ellipse(c.x,my+2,laughing?8:6,laughing?6:7,0,0,7);ctx.fill();}
  else if(mood>70){ctx.arc(c.x,my-4,10,.2*Math.PI,.8*Math.PI);ctx.stroke();}
  else if(mood>40){ctx.arc(c.x,my-3,7,.25*Math.PI,.75*Math.PI);ctx.stroke();}
  else{ctx.arc(c.x,my+8,8,1.25*Math.PI,1.75*Math.PI);ctx.stroke();}
  // eyewear
  if(save.eyes==='shades'){
    ctx.fillStyle='#14121f';ctx.strokeStyle='#14121f';ctx.lineWidth=2.5;
    for(const e of[eyeL,eyeR]){ctx.beginPath();ctx.roundRect?ctx.roundRect(e.x-10,e.y-7,20,13,5):ctx.rect(e.x-10,e.y-7,20,13);ctx.fill();}
    ctx.beginPath();ctx.moveTo(eyeL.x+9,eyeL.y-3);ctx.lineTo(eyeR.x-9,eyeR.y-3);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(eyeL.x-7,eyeL.y-5,5,2);ctx.fillRect(eyeR.x-7,eyeR.y-5,5,2);
  }else if(save.eyes==='monocle'){
    ctx.strokeStyle='#e0b84a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(eyeR.x,eyeR.y,11,0,7);ctx.stroke();
    ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(eyeR.x+9,eyeR.y+7);ctx.quadraticCurveTo(eyeR.x+18,eyeR.y+22,eyeR.x+10,eyeR.y+34);ctx.stroke();
  }
  // hat
  const hat=save.hatId||(save.hat?'party':null);
  if(hat){
    ctx.save();ctx.translate(top.x,top.y+4);
    if(hat==='party'){
      ctx.fillStyle='#ffcf5a';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(0,-34);ctx.lineTo(14,0);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#ff6b9a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(10,-8);ctx.moveTo(-5,-20);ctx.lineTo(5,-20);ctx.stroke();
      ctx.fillStyle='#ff6b9a';ctx.beginPath();ctx.arc(0,-35,4,0,7);ctx.fill();
    }else if(hat==='beanie'){
      ctx.fillStyle='#4f8ef7';ctx.beginPath();ctx.arc(0,2,20,Math.PI,0);ctx.fill();
      ctx.fillStyle='#3a6fd0';ctx.fillRect(-21,-2,42,8);
      ctx.fillStyle='#f4effd';ctx.beginPath();ctx.arc(0,-20,6,0,7);ctx.fill();
    }else if(hat==='tophat'){
      ctx.fillStyle='#1d1a2b';ctx.fillRect(-20,-4,40,6);ctx.fillRect(-12,-36,24,33);
      ctx.fillStyle='#d9534f';ctx.fillRect(-12,-12,24,6);
    }else if(hat==='crown'){
      ctx.fillStyle='#ffcf3a';ctx.strokeStyle='#c99a1a';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-18,2);ctx.lineTo(-18,-16);ctx.lineTo(-9,-7);ctx.lineTo(0,-22);ctx.lineTo(9,-7);ctx.lineTo(18,-16);ctx.lineTo(18,2);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff5d8f';ctx.beginPath();ctx.arc(0,-6,3,0,7);ctx.fill();ctx.fillStyle='#5fd0ff';ctx.beginPath();ctx.arc(-10,-4,2.4,0,7);ctx.arc(10,-4,2.4,0,7);ctx.fill();
    }else if(hat==='propeller'){
      ctx.fillStyle='#ff5d5d';ctx.beginPath();ctx.arc(0,2,18,Math.PI,Math.PI*1.5);ctx.lineTo(0,2);ctx.fill();
      ctx.fillStyle='#ffcf5a';ctx.beginPath();ctx.arc(0,2,18,Math.PI*1.5,0);ctx.lineTo(0,2);ctx.fill();
      ctx.fillStyle='#3a3550';ctx.fillRect(-1.5,-24,3,10);
      const spin=grounded()?simTime*2:simTime*30,bw=Math.abs(Math.cos(spin))*16+2;
      ctx.fillStyle='#5fd0ff';ctx.beginPath();ctx.ellipse(0,-24,bw,3,0,0,7);ctx.fill();
    }
    ctx.restore();
  }
  // knockout: stars orbit the head and a little ghost of Gloop drifts out, then zips back in on waking
  if(ko>0){
    const ox=top.x,oy=top.y-(save.hatId?30:12);
    for(let i=0;i<5;i++){
      const a=simTime*3.2+i*Math.PI*2/5,depth=(Math.sin(a)+1)/2,sx=ox+Math.cos(a)*30,sy=oy+Math.sin(a)*8;
      if(depth<.5)continue;
      const r=4+depth*3;ctx.fillStyle=i%2?'#ffe07a':'#ffb0d4';ctx.beginPath();
      for(let k=0;k<10;k++){const b=k*Math.PI/5+simTime*4,rr=k%2?r*.45:r;ctx.lineTo(sx+Math.cos(b)*rr,sy+Math.sin(b)*rr);}ctx.fill();
    }
    const out=ko>.7?Math.min(1,(6-ko)/1.2):ko/.7,gx=c.x+Math.sin(simTime*1.7)*10,gy=minY-10-out*60+Math.sin(simTime*2.3)*4;
    ctx.globalAlpha=.45*out;ctx.fillStyle=shade(col,.25);
    ctx.beginPath();ctx.arc(gx,gy,14,Math.PI,0);ctx.lineTo(gx+14,gy+12);
    for(let k=0;k<4;k++)ctx.quadraticCurveTo(gx+10.5-k*7,gy+(k%2?10:18),gx+7-k*7,gy+12);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=shade(col,-.55);ctx.fillRect(gx-7,gy-2,4,1.6);ctx.fillRect(gx+3,gy-2,4,1.6);
    ctx.globalAlpha=1;
    if(Math.random()<.02)parts.push({k:'txt',x:top.x+18,y:top.y-10,vx:12,vy:-26,t:1.4,text:'z',c:'#c9c1ea'});  }
  // speech bubble
  if(bubble){
    ctx.font='800 14px Nunito, system-ui, sans-serif';
    const tw=ctx.measureText(bubble.text).width,bw=tw+20,bh=28;
    let bx=Math.max(10,Math.min(W-bw-10,c.x-bw/2)),by=Math.max(10,minY-bh-(save.hat?46:18));
    ctx.globalAlpha=Math.min(1,bubble.t*3);
    ctx.fillStyle='#f4effd';ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,by,bw,bh,12):ctx.rect(bx,by,bw,bh);ctx.fill();
    ctx.beginPath();const tx=Math.max(bx+12,Math.min(bx+bw-12,c.x));ctx.moveTo(tx-6,by+bh);ctx.lineTo(tx,by+bh+8);ctx.lineTo(tx+6,by+bh);ctx.fill();
    ctx.fillStyle='#17142a';ctx.textBaseline='middle';ctx.fillText(bubble.text,bx+10,by+bh/2+1);
    ctx.globalAlpha=1;
  }
}
function drawParts(){
  for(const q of parts){
    ctx.globalAlpha=Math.min(1,q.t*2);
    if(q.k==='heart'){ctx.fillStyle='#ff7d9e';const s=6;ctx.beginPath();ctx.moveTo(q.x,q.y+s);ctx.bezierCurveTo(q.x-s*1.6,q.y-s*.2,q.x-s*.6,q.y-s*1.4,q.x,q.y-s*.4);ctx.bezierCurveTo(q.x+s*.6,q.y-s*1.4,q.x+s*1.6,q.y-s*.2,q.x,q.y+s);ctx.fill();}
    else if(q.k==='star'){ctx.fillStyle='#ffe07a';ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?2.5:6;ctx.lineTo(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r);}ctx.fill();}
    else if(q.k==='txt'){ctx.font='800 15px Nunito, system-ui, sans-serif';ctx.fillStyle=q.c;ctx.textAlign='center';ctx.fillText(q.text,q.x,q.y);ctx.textAlign='start';}
    else if(q.k==='smoke'){ctx.fillStyle='rgba(200,190,230,.5)';ctx.beginPath();ctx.arc(q.x,q.y,q.r*(1.6-q.t),0,7);ctx.fill();}
    else if(q.k==='spark'){ctx.fillStyle='#ffd166';ctx.fillRect(q.x-1.5,q.y-1.5,3,3);}
    else if(q.k==='crumb'){ctx.fillStyle='#d9a05b';ctx.fillRect(q.x-2,q.y-2,4,4);}
    else if(q.k==='glit'){ctx.fillStyle='hsl('+q.h+',90%,75%)';const s=2+q.t*4;ctx.beginPath();ctx.moveTo(q.x,q.y-s);ctx.lineTo(q.x+s*.35,q.y);ctx.lineTo(q.x,q.y+s);ctx.lineTo(q.x-s*.35,q.y);ctx.closePath();ctx.fill();ctx.fillRect(q.x-s,q.y-.6,s*2,1.2);}
    else if(q.k==='mallet'){
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.a-Math.PI/2+(q.t-.125)*6);
      ctx.fillStyle='#a0703c';ctx.fillRect(-3,0,6,46);
      ctx.fillStyle='#d9534f';ctx.fillRect(-16,-12,32,18);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-16,-12,32,4);
      ctx.restore();
    }
    else if(q.k==='flash'){ctx.fillStyle='rgba(255,240,200,'+(q.t*4)+')';ctx.beginPath();ctx.arc(q.x,q.y,90,0,7);ctx.fill();}
  }
  ctx.globalAlpha=1;
}

function throwVel(dx,dy){const k=.07,m=15;let vx=dx*k,vy=dy*k;const l=Math.hypot(vx,vy);if(l>m){vx*=m/l;vy*=m/l;}return{x:vx,y:vy};}
function predict(x,y,vx,vy,r){
  // same integration as the physics step, so the dotted arc matches the real flight
  const h=FIX/SUB,g=G*gravSign*h*h,out=[],fy=floorY();let bounces=0;
  for(let i=0;i<240;i++){
    vx*=.998;vy=vy*.998+g;x+=vx;y+=vy;
    if(x<8+r||x>W-8-r){vx=-vx*.6;x=Math.max(8+r,Math.min(W-8-r,x));}
    if(y>fy-r||y<8+r){if(++bounces>1)break;y=Math.max(8+r,Math.min(fy-r,y));vy=-vy*.4;}
    if(i%4===0)out.push([x,y]);
  }
  return out;
}
function drawArc(path,alpha,x0,y0){
  ctx.strokeStyle='#f4effd';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
  let px=x0,py=y0;
  path.forEach(([x,y],i)=>{ctx.globalAlpha=alpha*(1-i/path.length*.7);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();px=x;py=y;});
  ctx.globalAlpha=1;
}
function drawAim(){
  if(aim){
    const r={snack:9,ball:16,crate:20,firecracker:10,bowling:19,cactus:18}[aim.tool]||12;
    const dx=ptr.x-aim.x,dy=ptr.y-aim.y,d=Math.hypot(dx,dy);
    ctx.globalAlpha=.6;drawObj(Object.assign({type:aim.tool,x:d>10?ptr.x:aim.x,y:d>10?ptr.y:aim.y,r,ang:0,fuse:1.6}));ctx.globalAlpha=1;
    if(d>10){
      ctx.fillStyle='rgba(244,239,253,.5)';ctx.beginPath();ctx.arc(aim.x,aim.y,3,0,7);ctx.fill();
      const v=throwVel(dx,dy);drawArc(predict(ptr.x,ptr.y,v.x,v.y,r),.95,ptr.x,ptr.y);
      const pw=Math.round(Math.hypot(v.x,v.y)/15*100);
      ctx.font='800 12px Nunito, system-ui, sans-serif';ctx.fillStyle='#f4effd';ctx.fillText(pw+'%',ptr.x+10,ptr.y-10);
    }
  }else if(grab&&grab.type==='obj'){
    const o=grab.ref,vx=o.x-o.px,vy=o.y-o.py;
    if(Math.hypot(vx,vy)>1.2)drawArc(predict(o.x,o.y,vx,vy,o.r),.6,o.x,o.y);
  }
}
function drawTrails(){
  for(const o of objs){
    const sp=Math.hypot(o.x-o.px,o.y-o.py);
    o.trail=o.trail||[];
    if(sp>2.5&&!o.held)o.trail.push([o.x,o.y]);else if(o.trail.length)o.trail.shift();
    if(o.trail.length>14)o.trail.shift();
    if(o.trail.length>1){
      ctx.lineCap='round';
      for(let i=1;i<o.trail.length;i++){const a=o.trail[i-1],b=o.trail[i];ctx.strokeStyle='rgba(244,239,253,'+(i/o.trail.length*.35)+')';ctx.lineWidth=o.r*1.1*(i/o.trail.length);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    }
  }
}
function drawHoles(){
  for(const bh of holes){
    const grow=Math.min(1,(4-bh.t)*3,bh.t*3),r=34*grow;
    const g=ctx.createRadialGradient(bh.x,bh.y,r*.2,bh.x,bh.y,r*2.2);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.45,'rgba(60,20,110,.75)');g.addColorStop(1,'rgba(60,20,110,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bh.x,bh.y,r*2.2,0,7);ctx.fill();
    ctx.strokeStyle='rgba(200,160,255,.6)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){const a=simTime*5+i*2.1;ctx.beginPath();ctx.arc(bh.x,bh.y,r*(.9+i*.35),a,a+1.4);ctx.stroke();}
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bh.x,bh.y,r*.55,0,7);ctx.fill();
  }
}
function drawZap(){
  if(!zap)return;
  ctx.strokeStyle='#fff7a8';ctx.lineWidth=2.5;ctx.shadowColor='#ffe94d';ctx.shadowBlur=12;
  for(let k=0;k<3;k++){
    const t=pts[(Math.random()*N)|0];let x=zap.x,y=zap.y;
    ctx.beginPath();ctx.moveTo(x,y);
    for(let s=1;s<=6;s++){x=zap.x+(t.x-zap.x)*s/6+(s<6?(Math.random()-.5)*16:0);y=zap.y+(t.y-zap.y)*s/6+(s<6?(Math.random()-.5)*16:0);ctx.lineTo(x,y);}
    ctx.stroke();
  }
  ctx.shadowBlur=0;
}

// ---------- loop ----------
function resize(){
  const r=stage.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
let last=0,acc=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||FIX);last=t;acc+=dt;
  while(acc>=FIX){for(let s=0;s<SUB;s++)step(FIX/SUB);think(FIX);acc-=FIX;}
  ctx.save();if(shakeT>0){shakeT-=dt;const m=shakeT*22;ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);}
  drawRoom();drawHoles();drawTrails();for(const o of objs)drawObj(o);drawBlob();drawZap();drawParts();drawAim();ctx.restore();syncBars();
  requestAnimationFrame(frame);
}
function start(data){
  loadSave();if(data&&data.save)Object.assign(save,data.save);
  for(const[k,v]of Object.entries({looks:[],rooms:['night'],stats:{},ach:[],best:{}}))if(!save[k])save[k]=v;
  if(save.unlocked.includes('hat')&&!save.looks.includes('party')){save.looks.push('party');if(save.hat)save.hatId='party';}
  save.hat=false;if(!save.rooms.includes(save.room))save.room='night';
  $('nameInput').value=save.name;syncMute();
  resize();new ResizeObserver(resize).observe(stage);
  initBlob(W*.42,floorY()-R-4);
  // a starter ball so the room isn't empty
  spawn('snack',W*.62,floorY()-60);
  buildTray();setHint();
  setTimeout(()=>say('hello',true),500);
  requestAnimationFrame(t=>{last=t;frame(t);});
}
window.addEventListener('pagehide',flushSave);
window.claude?.hot?.snapshot?.(()=>({save}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
